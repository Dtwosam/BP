services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bp
      POSTGRES_USER: bp
      POSTGRES_PASSWORD: bp_dev_only
    ports:
      - "5432:5432"
    volumes:
      - bp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp -d bp"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  bp_postgres_data:
