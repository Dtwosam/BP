name: One-shot Phase 14 Gate B authorization reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gate-b-authorization-reconcile-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'phase14-v2-gate-b-authorization-20260910' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Record Gate B authorization boundary
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          AUTH_AT = '2026-09-10T10:05:28Z'
          BASE_MAIN = '09bc0356f68e7237fc95a5dc375b9fd9a0685d3c'
          READINESS_PR_HEAD = '24291c53c199690e755c422b0d0b4f01d3a05719'
          READINESS_MERGE = '09bc0356f68e7237fc95a5dc375b9fd9a0685d3c'
          READINESS_POST_MERGE_CI = 34463958011
          VERSION = '0.14.124'

          state_path = Path('PROJECT_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          if state.get('source_of_truth_version') != '0.14.123':
              raise SystemExit('unexpected source_of_truth_version')
          if state.get('trading_mode') != 'RESEARCH' or state.get('live_trading_enabled') is not False:
              raise SystemExit('research/live boundary changed')

          checkpoint = None
          def walk(value):
              global checkpoint
              if isinstance(value, dict):
                  if 'v2_gate_b_readiness_status' in value:
                      checkpoint = value
                      return
                  for item in value.values():
                      walk(item)
                      if checkpoint is not None:
                          return
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
                      if checkpoint is not None:
                          return
          walk(state)
          if checkpoint is None:
              raise SystemExit('Gate B checkpoint missing')

          assert checkpoint['v2_gate_b_readiness_last_result'] is True
          assert checkpoint['v2_gate_b_readiness_feature_only_prerequisite_satisfied'] is True
          assert checkpoint['v2_gate_b_readiness_holdout_touched'] is False
          assert checkpoint['v2_gate_b_research_gate_b_authorized'] is False
          assert checkpoint['v2_gate_b_research_automatic_promotion'] is False
          assert checkpoint['v2_gate_b_research_production_run_performed'] is False

          state['source_of_truth_version'] = VERSION
          state['updated_at'] = AUTH_AT

          readiness_closeout = (
              'Phase 14 V2 READY=true readiness evidence merged by PR #170 at '
              f'{READINESS_MERGE}; exact PR head {READINESS_PR_HEAD} passed CI, Historical '
              'Backfill Smoke, Live Recorder Smoke, and Recorder Short Soak, and post-merge '
              f'main CI {READINESS_POST_MERGE_CI} passed'
          )
          authorization_record = (
              'Explicit Phase 14 V2 Gate B research execution authorization granted at '
              f'{AUTH_AT}: authorize one exact-main research-only plan -> prepare -> '
              'evaluate-holdout run after READY=true; automatic promotion, Phase 15, live '
              'trading, geographic bypass, and nonzero money remain unauthorized'
          )
          for item in (readiness_closeout, authorization_record):
              if item not in state['completed']:
                  state['completed'].append(item)

          state['next_actions'] = [
              'Gate B research execution is explicitly authorized for one exact-main run only. Execute scripts/deploy/phase14_v2_gate_b_research_cloudshell.sh from the clean current main after this authorization record merges, bound to accepted deployed head e9c7afc1536880e4612cb6e3d1a7282fa37c69f5 and the accepted partitioned-storage evidence. The authorized scope is plan -> prepare -> evaluate-holdout -> summary; do not change the frozen research geometry or candidate grids.',
              'The plan must remain feature-only and freeze the final holdout before labels are queried. Prepare may read labels only for non-holdout IDs and must freeze the validation-selected policy before the final holdout. evaluate-holdout may read the frozen final-holdout labels exactly once. If any holdout artifact is produced, do not rerun or choose a different holdout based on its result.',
              'After Gate B completes or fails, record the exact artifacts, hashes, selected policy/calibration/edge parameters, final-holdout metrics, and safety checks in sanitized source-of-truth evidence before any downstream decision. Do not interpret execution authorization as automatic policy acceptance.',
              'Keep MODE=research, LIVE_TRADING_ENABLED=false, MAX_TRADE_SIZE_USD=0, MAX_DAILY_LOSS_USD=0, and automatic_promotion=false. Phase 15, geographic bypass, live trading, and all nonzero money remain separately blocked.'
          ]

          checkpoint.update({
              'v2_gate_b_readiness_status': 'PRODUCTION_PASS_READY_TRUE_GATE_B_AUTHORIZED_NOT_RUN',
              'v2_gate_b_readiness_acceptance_pr': 170,
              'v2_gate_b_readiness_acceptance_final_head': READINESS_PR_HEAD,
              'v2_gate_b_readiness_acceptance_merge_commit': READINESS_MERGE,
              'v2_gate_b_readiness_acceptance_post_merge_ci_run_id': READINESS_POST_MERGE_CI,
              'v2_gate_b_readiness_acceptance_post_merge_ci_passed': True,
              'v2_gate_b_research_gate_b_authorized': True,
              'v2_gate_b_research_gate_b_authorized_at': AUTH_AT,
              'v2_gate_b_research_gate_b_authorization_scope': 'ONE_SHOT_RESEARCH_PLAN_PREPARE_FINAL_HOLDOUT_EVALUATION_ONLY',
              'v2_gate_b_research_gate_b_authorization_source': 'explicit_user_authorization',
              'v2_gate_b_research_gate_b_authorized_from_main_head': BASE_MAIN,
              'v2_gate_b_research_gate_b_execution_status': 'AUTHORIZED_NOT_RUN',
              'v2_gate_b_research_automatic_promotion': False,
              'v2_gate_b_readiness_holdout_touched': False,
          })

          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          build = Path('docs/BUILD-ORDER.md')
          text = build.read_text(encoding='utf-8')
          start = text.index('## Immediate next action')
          end = text.index('\n\nProduction preflight evidence', start)
          replacement = '''## Immediate next action

**The Phase 14 V2 feature-only readiness prerequisite is satisfied and Gate B research execution is now explicitly authorized for one exact-main run. Execute `scripts/deploy/phase14_v2_gate_b_research_cloudshell.sh` from the clean current `main` after this authorization record merges, bound to accepted deployed head `e9c7afc1536880e4612cb6e3d1a7282fa37c69f5` and the accepted partitioned-storage evidence. The authorized sequence is `plan` -> `prepare` -> `evaluate-holdout` -> summary exactly once. Planning must remain label-free; `prepare` must keep final-holdout labels unread and freeze the validation-selected policy; only the final `evaluate-holdout` stage may read the frozen holdout labels. If a holdout artifact is created, do not rerun or select a different holdout from its result. This authorization does not enable automatic promotion, prospective V2 activation, Phase 15, geographic bypass, live trading, or nonzero money. `MODE=research`, `LIVE_TRADING_ENABLED=false`, zero trade/loss limits, and `automatic_promotion=false` remain mandatory.**'''
          build.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          changelog = Path('docs/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          if not text.startswith(marker):
              raise SystemExit('unexpected changelog header')
          entry = '''## 0.14.124 — 10 September 2026

The `READY=true` readiness milestone is now merged and post-merge verified: PR #170 final head `24291c53c199690e755c422b0d0b4f01d3a05719` passed the four exact-head gates, merged as `09bc0356f68e7237fc95a5dc375b9fd9a0685d3c`, and post-merge main CI `34463958011` passed. The feature-only prerequisite remains bound to 651 markets, accepted analysis start `2026-09-09T10:20:00Z`, five eligible folds, 24 feature-only final-holdout markets, and an untouched/unread final holdout at readiness time.

At `2026-09-10T10:05:28Z`, explicit authorization was granted for one Phase 14 V2 Gate B research execution. The authorized scope is the existing exact-main `plan` -> `prepare` -> `evaluate-holdout` sequence and summary only. Planning remains label-free; preparation may use only non-holdout labels and must freeze the validation-selected policy before the final holdout; the final holdout may then be evaluated exactly once. No frozen geometry, freshness candidates, fee/slippage assumptions, eligible-market minimums, or min-edge grid may change.

This authorization is not automatic policy acceptance and does not authorize prospective V2 activation, automatic promotion, Phase 15, geographic bypass, live trading, or nonzero money. Research/live-disabled/zero-money controls remain mandatory throughout the run and afterwards pending a separately recorded result decision.

'''
          changelog.write_text(marker + entry + text[len(marker):], encoding='utf-8')

          master = Path('docs/MASTER-SOURCE-OF-TRUTH.md')
          text = master.read_text(encoding='utf-8')
          old = 'Gate B remains unauthorized; no policy acceptance, prospective V2 activation, paper execution, promotion, Phase 15, or live/money change has occurred, and `automatic_promotion=false` remains mandatory.'
          new = 'Gate B one-shot research execution is now explicitly authorized for the existing exact-main `plan` -> `prepare` -> `evaluate-holdout` sequence only. This authorization permits the frozen final holdout to be read and evaluated exactly once after the validation selection is frozen; it does not itself accept a V2 policy or authorize prospective V2 activation, automatic promotion, Phase 15, geographic bypass, live trading, or nonzero money. `automatic_promotion=false` and all research/zero-money controls remain mandatory.'
          if old not in text:
              raise SystemExit('master Gate B authorization marker missing')
          master.write_text(text.replace(old, new, 1), encoding='utf-8')

          decisions = Path('docs/DECISION-LOG.md')
          text = decisions.read_text(encoding='utf-8').rstrip()
          if '## D-039 — Gate B research execution is authorized once without downstream promotion' not in text:
              text += '''

## D-039 — Gate B research execution is authorized once without downstream promotion
**Date:** 10 Sep 2026
**Status:** Active

The feature-only Gate B readiness prerequisite is satisfied and its accepted `READY=true` evidence is merged to `main`. Explicit authorization is now granted for one Phase 14 V2 Gate B research execution using the existing frozen contract: label-free `plan`, labeled non-holdout `prepare`, then one-time `evaluate-holdout` against the hash-bound final holdout. The validation selection must be frozen before final-holdout labels are read, and a produced holdout artifact makes that final evaluation one-shot; its result must not be used to select a different holdout or alter the preregistered search geometry.

This authorization covers research evaluation only. It does not itself accept any V2 policy/model/calibration/edge/min-edge selection and does not authorize prospective V2 activation, automatic promotion, Phase 15, geographic bypass, live trading, or nonzero money. The run must preserve `MODE=research`, `LIVE_TRADING_ENABLED=false`, `MAX_TRADE_SIZE_USD=0`, `MAX_DAILY_LOSS_USD=0`, and `automatic_promotion=false`, and its result must be recorded before any downstream decision.
'''
          decisions.write_text(text + '\n', encoding='utf-8')

          contract = Path('tests/v2_research/test_gate_b_contract.py')
          text = contract.read_text(encoding='utf-8')
          old = '    assert checkpoint["v2_gate_b_research_gate_b_authorized"] is False\n'
          if old not in text:
              raise SystemExit('authorization assertion missing')
          text = text.replace(old, '    assert checkpoint["v2_gate_b_research_gate_b_authorized"] is True\n', 1)
          old = '''    assert checkpoint["v2_gate_b_readiness_status"] == (\n        "PRODUCTION_PASS_READY_TRUE_GATE_B_UNAUTHORIZED"\n    )\n'''
          new = '''    assert checkpoint["v2_gate_b_readiness_status"] == (\n        "PRODUCTION_PASS_READY_TRUE_GATE_B_AUTHORIZED_NOT_RUN"\n    )\n    assert checkpoint["v2_gate_b_research_gate_b_authorization_scope"] == (\n        "ONE_SHOT_RESEARCH_PLAN_PREPARE_FINAL_HOLDOUT_EVALUATION_ONLY"\n    )\n    assert checkpoint["v2_gate_b_research_gate_b_execution_status"] == "AUTHORIZED_NOT_RUN"\n'''
          if old not in text:
              raise SystemExit('readiness status assertion missing')
          contract.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify authorization boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('PROJECT_STATE.json').read_text())
          assert state['source_of_truth_version'] == '0.14.124'
          assert state['trading_mode'] == 'RESEARCH'
          assert state['live_trading_enabled'] is False

          checkpoint = None
          def walk(value):
              global checkpoint
              if isinstance(value, dict):
                  if 'v2_gate_b_readiness_status' in value:
                      checkpoint = value
                      return
                  for item in value.values():
                      walk(item)
                      if checkpoint is not None:
                          return
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
                      if checkpoint is not None:
                          return
          walk(state)
          assert checkpoint is not None
          assert checkpoint['v2_gate_b_readiness_last_result'] is True
          assert checkpoint['v2_gate_b_research_gate_b_authorized'] is True
          assert checkpoint['v2_gate_b_research_gate_b_execution_status'] == 'AUTHORIZED_NOT_RUN'
          assert checkpoint['v2_gate_b_readiness_holdout_touched'] is False
          assert checkpoint['v2_gate_b_research_automatic_promotion'] is False
          assert checkpoint['v2_gate_b_research_production_run_performed'] is False
          assert 'PRODUCTION_PASS_READY_TRUE_GATE_B_AUTHORIZED_NOT_RUN' in Path('tests/v2_research/test_gate_b_contract.py').read_text()
          PY

      - name: Commit authorization record and self-delete
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/gate-b-authorization-reconcile-once.yml
          git add PROJECT_STATE.json docs/BUILD-ORDER.md docs/CHANGELOG.md docs/MASTER-SOURCE-OF-TRUTH.md docs/DECISION-LOG.md tests/v2_research/test_gate_b_contract.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'expected authorization reconciliation changes missing' >&2; exit 1; }
          git commit -m 'Record one-shot V2 Gate B authorization'
          git push origin HEAD:"$BRANCH"
