name: Polymarket Rotation Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  three-arm-socket-history:
    if: github.head_ref == 'investigate-polymarket-rotation-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify diagnostic
        run: ruff check scripts/diagnose_polymarket_three_arm_socket_history.py
      - name: Compare static-aged, rotating-aged, and fresh subscriptions
        run: python scripts/diagnose_polymarket_three_arm_socket_history.py
