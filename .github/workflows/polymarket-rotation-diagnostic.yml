name: Polymarket Rotation Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  early-target-natural-churn:
    if: github.head_ref == 'investigate-polymarket-rotation-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify diagnostic
        run: ruff check scripts/diagnose_polymarket_early_target_natural_churn.py
      - name: Compare early dynamic target with and without natural 5m rotation
        run: python scripts/diagnose_polymarket_early_target_natural_churn.py
