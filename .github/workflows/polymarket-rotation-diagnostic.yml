name: Polymarket Rotation Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-broad:
    if: github.head_ref == 'investigate-polymarket-rotation-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify broad diagnostic
        run: ruff check scripts/diagnose_polymarket_static_breadth.py
      - name: Probe broad static subscription
        run: python scripts/diagnose_polymarket_static_breadth.py

  static-narrow:
    if: github.head_ref == 'investigate-polymarket-rotation-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify narrow diagnostic
        run: ruff check scripts/diagnose_polymarket_static_narrow.py
      - name: Probe narrow static subscription
        run: python scripts/diagnose_polymarket_static_narrow.py
