name: Polymarket Rotation Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  affected-trade-activity:
    if: github.head_ref == 'investigate-polymarket-rotation-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify diagnostic
        run: ruff check scripts/diagnose_polymarket_affected_trade_activity.py
      - name: Compare public trades with BP websocket cutoffs
        run: python scripts/diagnose_polymarket_affected_trade_activity.py
