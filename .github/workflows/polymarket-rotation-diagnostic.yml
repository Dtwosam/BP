name: Polymarket Rotation Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dynamic-15m-age:
    if: github.head_ref == 'investigate-polymarket-rotation-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify diagnostic
        run: ruff check scripts/diagnose_polymarket_dynamic_15m_age.py
      - name: Probe dynamic 15m subscription age
        run: python scripts/diagnose_polymarket_dynamic_15m_age.py

  dynamic-15m-with-5m-churn:
    if: github.head_ref == 'investigate-polymarket-rotation-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify diagnostic
        run: ruff check scripts/diagnose_polymarket_dynamic_15m_with_5m_churn.py
      - name: Probe 15m age with narrow 5m churn
        run: python scripts/diagnose_polymarket_dynamic_15m_with_5m_churn.py
