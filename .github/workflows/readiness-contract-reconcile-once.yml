name: One-shot Phase 14 readiness contract reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/readiness-contract-reconcile-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'phase14-v2-readiness-true-20260910' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile readiness state and contract test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('PROJECT_STATE.json')
          state = json.loads(state_path.read_text())
          target = None
          def walk(value):
              global target
              if isinstance(value, dict):
                  if 'v2_gate_b_readiness_status' in value:
                      target = value
                      return
                  for item in value.values():
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          walk(state)
          assert target is not None
          assert target['v2_gate_b_readiness_status'] == 'PRODUCTION_PASS_READY_TRUE_GATE_B_UNAUTHORIZED'
          assert target['v2_gate_b_readiness_last_result'] is True
          assert target['v2_gate_b_research_retry_blocked_until_feature_only_readiness'] is True
          target['v2_gate_b_research_retry_blocked_until_feature_only_readiness'] = False
          state_path.write_text(json.dumps(state, indent=2) + '\n')

          path = Path('tests/v2_research/test_gate_b_contract.py')
          text = path.read_text()
          replacements = {
              '''        checkpoint["v2_gate_b_research_retry_blocked_until_feature_only_readiness"]\n        is True\n''': '''        checkpoint["v2_gate_b_research_retry_blocked_until_feature_only_readiness"]\n        is False\n''',
              '''    assert checkpoint["v2_gate_b_readiness_status"] == (\n        "PRODUCTION_PASS_READY_FALSE"\n    )\n''': '''    assert checkpoint["v2_gate_b_readiness_status"] == (\n        "PRODUCTION_PASS_READY_TRUE_GATE_B_UNAUTHORIZED"\n    )\n''',
              '''    assert checkpoint["v2_gate_b_readiness_last_result"] is False\n    assert checkpoint["v2_gate_b_readiness_last_market_count"] == 496\n    assert checkpoint["v2_gate_b_readiness_last_analysis_start_attempt_count"] == 81\n    assert checkpoint["v2_gate_b_readiness_last_candidate_rejection_count"] == 81\n    assert checkpoint["v2_gate_b_readiness_last_candidate_rejection_stage_counts"] == {\n        "test": 13,\n        "validation": 4,\n        "train": 64,\n    }\n    assert checkpoint["v2_gate_b_readiness_last_blocking_reason"] == (\n        "no contiguous Gate B epoch satisfies the frozen walk-forward minimums; "\n        "last rejection: train requires at least 24 markets; found 19"\n    )\n    assert checkpoint["v2_gate_b_readiness_last_candidate_start"] == (\n        "2026-09-09T04:20:00+00:00"\n    )\n    assert checkpoint["v2_gate_b_readiness_last_candidate_train_market_count"] == 19\n''': '''    assert checkpoint["v2_gate_b_readiness_last_result"] is True\n    assert checkpoint["v2_gate_b_readiness_last_market_count"] == 651\n    assert checkpoint["v2_gate_b_readiness_last_analysis_start_attempt_count"] == 84\n    assert checkpoint["v2_gate_b_readiness_last_candidate_rejection_count"] == 83\n    assert checkpoint["v2_gate_b_readiness_last_candidate_rejection_stage_counts"] == {\n        "test": 14,\n        "validation": 5,\n        "train": 64,\n    }\n    assert checkpoint["v2_gate_b_readiness_last_blocking_reason"] is None\n    assert checkpoint["v2_gate_b_readiness_last_candidate_start"] == (\n        "2026-09-09T10:20:00+00:00"\n    )\n    assert checkpoint["v2_gate_b_readiness_last_analysis_start_at"] == (\n        "2026-09-09T10:20:00+00:00"\n    )\n    assert checkpoint["v2_gate_b_readiness_last_eligible_fold_count"] == 5\n    assert checkpoint["v2_gate_b_readiness_last_final_holdout_market_count"] == 24\n''',
              '''    assert checkpoint["v2_gate_b_readiness_last_would_plan_sha256"] is None\n''': '''    assert checkpoint["v2_gate_b_readiness_last_would_plan_sha256"] == (\n        "a1c2dff984a1dc6a2720961781af83f0d1999fbb632e33d9932c5582e688d5e2"\n    )\n    assert checkpoint["v2_gate_b_readiness_feature_only_prerequisite_satisfied"] is True\n    assert checkpoint["v2_gate_b_readiness_retry_required"] is False\n''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected contract block missing: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('PROJECT_STATE.json').read_text())
          assert state['source_of_truth_version'] == '0.14.123'
          assert state['trading_mode'] == 'RESEARCH'
          assert state['live_trading_enabled'] is False
          raw = Path('PROJECT_STATE.json').read_text()
          assert '"v2_gate_b_research_retry_blocked_until_feature_only_readiness": false' in raw
          assert '"v2_gate_b_research_gate_b_authorized": false' in raw
          assert '"v2_gate_b_research_automatic_promotion": false' in raw
          test = Path('tests/v2_research/test_gate_b_contract.py').read_text()
          assert 'PRODUCTION_PASS_READY_TRUE_GATE_B_UNAUTHORIZED' in test
          assert 'v2_gate_b_readiness_last_market_count"] == 651' in test
          assert 'v2_gate_b_readiness_last_eligible_fold_count"] == 5' in test
          assert 'v2_gate_b_readiness_last_final_holdout_market_count"] == 24' in test
          PY

      - name: Commit and self-delete
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/readiness-contract-reconcile-once.yml
          git add PROJECT_STATE.json tests/v2_research/test_gate_b_contract.py
          git diff --cached --check
          git commit -m 'Align Gate B contract with readiness satisfied'
          git push origin HEAD:"$BRANCH"
