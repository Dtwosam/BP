name: Phase12 Replay Performance Transform V2

on:
  push:
    branches:
      - phase-12-paper-execution-v1
    paths:
      - .github/workflows/phase12-replay-performance-transform-v2.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-paper-execution-v1
          fetch-depth: 0

      - name: Apply host and install replay hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"expected exactly one match in {path}, found {text.count(old)}: {old!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          host = "scripts/deploy/phase12_host_acceptance.sh"
          replace_once(
              host,
              'POLL_SECONDS="${PHASE12_ACCEPTANCE_POLL_SECONDS:-5}"\n',
              'POLL_SECONDS="${PHASE12_ACCEPTANCE_POLL_SECONDS:-5}"\n'
              'PAPER_ONCE_TIMEOUT_SECONDS="${PHASE12_PAPER_ONCE_TIMEOUT_SECONDS:-120}"\n',
          )
          replace_once(
              host,
              'for value in "$WINDOW_SECONDS" "$MAX_WINDOWS" "$POLL_SECONDS"; do\n',
              'for value in "$WINDOW_SECONDS" "$MAX_WINDOWS" "$POLL_SECONDS" "$PAPER_ONCE_TIMEOUT_SECONDS"; do\n',
          )
          replace_once(
              host,
              '  "$REPO/migrations/0011_paper_execution.sql"\n',
              '  "$REPO/migrations/0011_paper_execution.sql"\n'
              '  "$REPO/migrations/0012_paper_replay_indexes.sql"\n'
              '  "$REPO/scripts/deploy/ensure_phase12_replay_indexes.py"\n',
          )
          replace_once(
              host,
              'PY\n\nSTART_ISO=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)\n',
              'PY\n\n'
              'run_candidate "$VENV/bin/python" "$REPO/scripts/deploy/ensure_phase12_replay_indexes.py" \\\n'
              '  > "$run_dir/replay-indexes.txt"\n\n'
              'START_ISO=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)\n',
          )
          replace_once(
              host,
              'paper_once() {\n'
              '  run_candidate "$VENV/bin/python" -m bp_engine.execution --once \\\n'
              '    | tee -a "$run_dir/paper-worker-runs.jsonl"\n'
              '}\n',
              'paper_once() {\n'
              '  local rc=0\n'
              '  set +e\n'
              '  run_candidate timeout --signal=TERM --kill-after=10s "${PAPER_ONCE_TIMEOUT_SECONDS}s" \\\n'
              '    "$VENV/bin/python" -m bp_engine.execution --once \\\n'
              '    | tee -a "$run_dir/paper-worker-runs.jsonl"\n'
              '  rc=${PIPESTATUS[0]}\n'
              '  set -e\n'
              '  if [[ "$rc" -eq 124 || "$rc" -eq 137 ]]; then\n'
              '    echo "PHASE12_HOST_ACCEPTANCE=FAIL"\n'
              '    echo "REASON=paper_once_timeout"\n'
              '    return "$rc"\n'
              '  fi\n'
              '  return "$rc"\n'
              '}\n',
          )
          replace_once(
              host,
              'before_fingerprint=$(fingerprint_target)\n'
              'run_candidate "$VENV/bin/python" -m bp_engine.execution --once \\\n'
              '  | tee -a "$run_dir/paper-worker-runs.jsonl"\n'
              'after_fingerprint=$(fingerprint_target)\n',
              'before_fingerprint=$(fingerprint_target)\n'
              'paper_once\n'
              'after_fingerprint=$(fingerprint_target)\n',
          )

          install = "scripts/deploy/phase12_install.sh"
          replace_once(
              install,
              'ENV_FILE="${BP_ENV_FILE:-/etc/bp/bp.env}"\n',
              'ENV_FILE="${BP_ENV_FILE:-/etc/bp/bp.env}"\n'
              'PAPER_ONCE_TIMEOUT_SECONDS="${PHASE12_PAPER_ONCE_TIMEOUT_SECONDS:-120}"\n',
          )
          replace_once(
              install,
              'if [[ -z "$EXPECTED_HEAD" ]]; then\n'
              '  echo "usage: $0 EXPECTED_HEAD" >&2\n'
              '  exit 2\n'
              'fi\n',
              'if [[ -z "$EXPECTED_HEAD" ]]; then\n'
              '  echo "usage: $0 EXPECTED_HEAD" >&2\n'
              '  exit 2\n'
              'fi\n'
              'if ! [[ "$PAPER_ONCE_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then\n'
              '  echo "PHASE12_PAPER_ONCE_TIMEOUT_SECONDS must be a positive integer" >&2\n'
              '  exit 2\n'
              'fi\n',
          )
          replace_once(
              install,
              '  "$BP_ROOT/migrations/0011_paper_execution.sql"\n',
              '  "$BP_ROOT/migrations/0011_paper_execution.sql"\n'
              '  "$BP_ROOT/migrations/0012_paper_replay_indexes.sql"\n'
              '  "$BP_ROOT/scripts/deploy/ensure_phase12_replay_indexes.py"\n',
          )
          replace_once(
              install,
              'run_as_bp() {\n'
              '  sudo -u "$BP_USER" env \\\n'
              '    MODE=research \\\n'
              '    LIVE_TRADING_ENABLED=false \\\n'
              '    MAX_TRADE_SIZE_USD=0 \\\n'
              '    MAX_DAILY_LOSS_USD=0 \\\n'
              '    BP_ENV_FILE="$ENV_FILE" \\\n'
              '    "$@"\n'
              '}\n',
              'run_as_bp() {\n'
              '  sudo -u "$BP_USER" env \\\n'
              '    MODE=research \\\n'
              '    LIVE_TRADING_ENABLED=false \\\n'
              '    MAX_TRADE_SIZE_USD=0 \\\n'
              '    MAX_DAILY_LOSS_USD=0 \\\n'
              '    BP_ENV_FILE="$ENV_FILE" \\\n'
              '    "$@"\n'
              '}\n\n'
              'paper_once() {\n'
              '  local output=$1\n'
              '  local rc=0\n'
              '  set +e\n'
              '  run_as_bp timeout --signal=TERM --kill-after=10s "${PAPER_ONCE_TIMEOUT_SECONDS}s" \\\n'
              '    "$BP_ROOT/.venv/bin/python" -m bp_engine.execution --once > "$output"\n'
              '  rc=$?\n'
              '  set -e\n'
              '  if [[ "$rc" -eq 124 || "$rc" -eq 137 ]]; then\n'
              '    echo "Phase 12 paper execution --once timed out" >&2\n'
              '  fi\n'
              '  return "$rc"\n'
              '}\n',
          )
          replace_once(
              install,
              'PY\n\nNODE_PATH="$NODE_ROOT/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"\n',
              'PY\n\n'
              'run_as_bp "$BP_ROOT/.venv/bin/python" \\\n'
              '  "$BP_ROOT/scripts/deploy/ensure_phase12_replay_indexes.py"\n\n'
              'NODE_PATH="$NODE_ROOT/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"\n',
          )
          replace_once(
              install,
              'run_as_bp "$BP_ROOT/.venv/bin/python" -m bp_engine.execution --once > /var/tmp/bp-phase12-install-once.json\n'
              'run_as_bp "$BP_ROOT/.venv/bin/python" -m bp_engine.execution --once > /var/tmp/bp-phase12-install-rerun.json\n',
              'paper_once /var/tmp/bp-phase12-install-once.json\n'
              'paper_once /var/tmp/bp-phase12-install-rerun.json\n',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/deploy/phase12_host_acceptance.sh scripts/deploy/phase12_install.sh
          git commit -m "perf: harden phase12 replay runtime"
          git push origin HEAD:phase-12-paper-execution-v1
