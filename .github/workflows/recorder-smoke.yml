name: Live Recorder Smoke

on:
  push:
    branches:
      - build/phase-2-recorder
      - phase-14-live-readiness-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recorder-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Unit verification
        run: |
          pytest
          ruff check src tests scripts
          python -m compileall -q src

      - name: Capture live public feeds
        run: python scripts/recorder_smoke.py

      - name: Commit public smoke evidence when changed
        if: >-
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/build/phase-2-recorder'
        run: |
          if git diff --quiet -- tests/fixtures/recorder/live/; then
            echo "No smoke evidence change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/fixtures/recorder/live/
          git commit -m "test: capture live recorder smoke evidence [skip ci]"
          git push origin HEAD:build/phase-2-recorder
