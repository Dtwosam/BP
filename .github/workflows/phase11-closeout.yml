name: Phase 11 Closeout

on:
  push:
    branches:
      - phase-11-dashboard-v1
    paths:
      - .github/workflows/phase11-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted operational commit
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 126959eaef973b061c3c7ea619b6d6313f3f4e4e HEAD

      - name: Transform closeout documents
        run: |
          set -Eeuo pipefail
          python scripts/phase11_closeout_docs.py
          python -m json.tool PROJECT_STATE.json >/dev/null
          python -m json.tool docs/evidence/phase-11-closeout-20260828.json >/dev/null
          git diff --check

      - name: Remove temporary helpers
        run: |
          rm scripts/phase11_closeout_docs.py
          rm .github/workflows/phase11-closeout.yml

      - name: Commit closeout
        run: |
          set -Eeuo pipefail
          git config user.name Dtwosam
          git config user.email 42391449+Dtwosam@users.noreply.github.com
          git add -A
          git commit -m 'docs: close phase11 dashboard'
          git push origin HEAD:phase-11-dashboard-v1
