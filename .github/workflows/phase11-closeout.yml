name: Phase 11 closeout

on:
  push:
    branches:
      - phase-11-dashboard-v1
    paths:
      - .github/workflows/phase11-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted operational ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          ACCEPTED=126959eaef973b061c3c7ea619b6d6313f3f4e4e
          git merge-base --is-ancestor "$ACCEPTED" HEAD
          unexpected="$(git diff --name-only "$ACCEPTED" HEAD | grep -v '^.github/workflows/phase11-closeout.yml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes since accepted operational commit:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Record Phase 11 closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import OrderedDict
          from pathlib import Path

          accepted = "126959eaef973b061c3c7ea619b6d6313f3f4e4e"
          updated_at = "2026-08-28T15:38:49Z"

          state_path = Path("PROJECT_STATE.json")
          state = json.loads(state_path.read_text(encoding="utf-8"), object_pairs_hook=OrderedDict)
          state["source_of_truth_version"] = "0.11.0"
          state["updated_at"] = updated_at
          state["current_phase"] = 12
          state["current_phase_name"] = "paper execution"
          state["status"] = "PHASE_11_COMPLETE_PHASE_12_READY"
          state["trading_mode"] = "RESEARCH"
          state["live_trading_enabled"] = False

          checkpoint = OrderedDict([
              ("host_accepted_operational_commit", accepted),
              ("ci_run", 1223),
              ("ci_passed", True),
              ("host_acceptance_verdict", "PASS"),
              ("permanent_install_verdict", "PASS"),
              ("dashboard_api_listener", "127.0.0.1:8787"),
              ("dashboard_web_listener", "127.0.0.1:3000"),
              ("host_acceptance_api_listener", "127.0.0.1:18787"),
              ("host_acceptance_web_listener", "127.0.0.1:13000"),
              ("node_version", "v24.20.0"),
              ("recorder_active_after_install", True),
              ("postgres_active_after_install", True),
              ("dashboard_api_active_after_install", True),
              ("dashboard_web_active_after_install", True),
              ("mutation_post_status", 405),
              ("active_markets_at_host_acceptance", 4),
              ("feed_rows_at_host_acceptance", 4),
              ("performance_rows_at_host_acceptance", 2),
              ("prediction_history_rows_at_host_acceptance", 26),
              ("evaluated_predictions_at_host_acceptance", 0),
              ("paper_pnl_status", "UNAVAILABLE_UNTIL_PHASE_12"),
              ("execution_available", False),
              ("paper_execution_available", False),
              ("live_trading_enabled", False),
              ("money_execution_path_added", False),
              ("profitability_claim", False),
              ("host_evidence_dir", "/var/lib/bp/evidence/phase11-dashboard/20260828T151015Z"),
              ("sanitized_evidence", "docs/evidence/phase-11-closeout-20260828.json"),
          ])

          rebuilt = OrderedDict()
          for key, value in state.items():
              if key == "completed":
                  rebuilt["phase_11_checkpoint"] = checkpoint
              rebuilt[key] = value
          state = rebuilt

          phase11_completed = [
              "Phase 11 read-only Python dashboard snapshot API implemented with fail-closed RESEARCH mode and no mutation/execution path",
              "Phase 11 Next.js operator dashboard implemented for active markets, model/market state, feed health, immutable prediction history, evaluation-backed performance, and current mode",
              "Phase 11 localhost-only hardened systemd deployment and rollback-capable installer implemented",
              "Phase 11 production host acceptance passed on the exact operational commit with 4 active markets, 4 feed rows, 2 performance rows, and 26 prediction-history rows",
              "Phase 11 permanent production install passed with recorder/PostgreSQL continuity, loopback-only dashboard listeners, and POST mutation rejection",
              "Phase 11 closeout evidence recorded",
          ]
          completed = list(state.get("completed", []))
          for item in phase11_completed:
              if item not in completed:
                  completed.append(item)
          state["completed"] = completed
          state["not_completed"] = ["Paper trading", "Live trading"]
          state["next_actions"] = [
              "Begin Phase 12 Paper Execution",
              "Implement simulated orders through the same execution interface intended for later live trading, without wallet/signing/order placement",
              "Model executable bid/ask, depth, partial fills, latency, slippage, cancellations, expiry, and fees",
              "Reconcile every paper order/fill deterministically to immutable Phase 10 live prediction signals and preserve no-trade decisions",
              "Expose paper positions, fills, realized/unrealized paper P&L, execution diagnostics, and reconciliation status through the Phase 11 dashboard",
              "Keep LIVE_TRADING_ENABLED=false and zero real-money trade-size/daily-loss limits; Phase 14 live-readiness and explicit authorization remain mandatory before real trading",
          ]
          state_path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")

          evidence = OrderedDict([
              ("phase", 11),
              ("name", "Dashboard V1"),
              ("date", "2026-08-28"),
              ("operational_commit", accepted),
              ("ci", {"run_number": 1223, "passed": True, "python_tests": 511, "dashboard_test_typecheck_build": "PASS"}),
              ("isolated_host_acceptance", {
                  "verdict": "PASS",
                  "api_listener": "127.0.0.1:18787",
                  "web_listener": "127.0.0.1:13000",
                  "recorder_status": "active",
                  "active_markets": 4,
                  "feed_rows": 4,
                  "performance_rows": 2,
                  "prediction_history_rows": 26,
                  "evaluated_predictions": 0,
                  "evidence_dir": "/var/lib/bp/evidence/phase11-dashboard/20260828T151015Z",
              }),
              ("permanent_install", {
                  "verdict": "PASS",
                  "head": accepted,
                  "node_version": "v24.20.0",
                  "api_status": "active",
                  "web_status": "active",
                  "recorder_before": "active",
                  "recorder_after": "active",
                  "postgres_after": "active",
                  "api_listener": "127.0.0.1:8787",
                  "web_listener": "127.0.0.1:3000",
                  "api_health": {"status": "ok", "mode": "RESEARCH", "live_trading_enabled": False},
                  "post_snapshot_status": 405,
              }),
              ("safety", {
                  "trading_mode": "RESEARCH",
                  "live_trading_enabled": False,
                  "execution_available": False,
                  "paper_execution_available": False,
                  "paper_pnl": {"status": "UNAVAILABLE_UNTIL_PHASE_12", "value": None},
                  "money_execution_path_added": False,
                  "profitability_claim": False,
              }),
              ("interpretation", "Phase 11 closes the read-only operator dashboard only. Zero evaluated predictions at host acceptance is valid append-only evidence, not a performance claim. Paper execution begins in Phase 12; live trading remains blocked by later gates and explicit authorization."),
          ])
          evidence_path = Path("docs/evidence/phase-11-closeout-20260828.json")
          evidence_path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")

          start = Path("START-HERE.md")
          start_text = start.read_text(encoding="utf-8")
          replacement = '''## Current next step

Phase 12: build **Paper Execution**. Phase 11 — Dashboard V1 — is production-host accepted and permanently installed on exact operational candidate `126959eaef973b061c3c7ea619b6d6313f3f4e4e`.

Fresh exact-head Phase 11 CI passed on that candidate with 511 Python tests plus dashboard test/typecheck/production-build gates. Isolated production-host acceptance returned `PHASE11_HOST_ACCEPTANCE=PASS` with 4 active markets, 4 feed-health rows, 2 performance rows, 26 immutable prediction-history rows, localhost-only candidate listeners, and the recorder still active. Permanent installation then returned `PHASE11_INSTALL=PASS`; `bp-recorder`, PostgreSQL, dashboard API, and dashboard web were all active, permanent listeners remained `127.0.0.1:8787` and `127.0.0.1:3000`, API health remained `RESEARCH` with live trading disabled, and POST mutation requests returned HTTP 405.

The dashboard remains read-only. At acceptance there were zero official evaluations, so performance surfaces correctly show only available append-only evidence and do not manufacture results. Paper P&L remains explicitly `UNAVAILABLE_UNTIL_PHASE_12` until simulated fills exist.

Phase 12 must implement realistic simulated execution against the immutable 5m/15m prediction signals using the same interface intended for later live trading. Model bid/ask, depth, partial fills, latency, slippage, cancellations, expiry, and fees; reconcile every paper trade to its immutable signal; and feed paper positions/P&L/execution diagnostics back into the dashboard. `LIVE_TRADING_ENABLED=false`; no wallet/signing/real-order path is authorized; Phase 14 live readiness and explicit user authorization remain mandatory before any real-money trading.
'''
          start_text = re.sub(r"## Current next step\n.*\Z", replacement, start_text, flags=re.S)
          start.write_text(start_text, encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          readme_text = readme_text.replace(
              "**Phases 0–10:** complete.  \n**Current phase:** Phase 11 — Dashboard V1.  ",
              "**Phases 0–11:** complete.  \n**Current phase:** Phase 12 — Paper Execution.  ",
          )
          readme_text = re.sub(
              r"Phase 10 is production-host accepted.*?\n\n## Read before working",
              "Phase 11 is production-host accepted and permanently installed on exact operational candidate `126959eaef973b061c3c7ea619b6d6313f3f4e4e`. The accepted dashboard is read-only and localhost-only, surfaces the immutable 5m/15m prediction system without direct database access, and keeps paper P&L unavailable until Phase 12 supplies real simulated-fill evidence. The ~80% accuracy discussed for this project remains a research target, not an assumed or proven capability, and Phase 11 acceptance is not a profitability claim.\n\n## Read before working",
              readme_text,
              flags=re.S,
          )
          readme_text = readme_text.replace(
              "- Phase 11 is a dashboard/read surface, not an execution phase.\n- Paper execution is Phase 12 and must not be invented inside the dashboard.",
              "- Phase 11 Dashboard V1 is accepted and remains a read-only surface.\n- Phase 12 is the current paper-execution phase; simulated fills must reconcile to immutable signals and must never place real orders.",
          )
          proof = '''## Accepted Phase 11 proof

Fresh exact-head CI passed on `126959eaef973b061c3c7ea619b6d6313f3f4e4e` (run #1223): 511 Python tests passed, deployment validation and health passed, and the dashboard test/typecheck/Next.js production build lane passed. Isolated production-host acceptance returned `PHASE11_HOST_ACCEPTANCE=PASS` with 4 active markets, 4 feed rows, 2 performance rows, 26 prediction-history rows, localhost-only candidate listeners, and the recorder active.

Permanent installation returned `PHASE11_INSTALL=PASS` on the same exact operational SHA. `bp-recorder`, PostgreSQL, `bp-dashboard-api`, and `bp-dashboard-web` were active after install; permanent listeners were only `127.0.0.1:8787` and `127.0.0.1:3000`; API health reported `mode=RESEARCH` and `live_trading_enabled=false`; and POST to the snapshot endpoint returned HTTP 405.

Sanitized acceptance evidence is recorded in `docs/evidence/phase-11-closeout-20260828.json`. The next build-order task is Phase 12 Paper Execution: realistic simulated order/fill mechanics using the future live interface, reconciled against immutable signals. Live trading remains disabled.
'''
          readme_text = re.sub(r"## Accepted Phase 10 proof\n.*\Z", proof, readme_text, flags=re.S)
          readme.write_text(readme_text, encoding="utf-8")

          changelog = Path("docs/CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          section = '''## 0.11.0 — 28 August 2026

Phase 11 — Dashboard V1 — closed after exact-head CI, isolated production-host acceptance, and permanent host installation on operational candidate `126959eaef973b061c3c7ea619b6d6313f3f4e4e`. CI run #1223 passed 511 Python tests plus lint, deployment validation, health, dashboard tests, strict TypeScript typecheck, and the Next.js production build.

Dashboard V1 adds a read-only Python snapshot API and a localhost-only Next.js operator surface for active markets, model probabilities, observed market prices, edge/action, four-feed health, immutable prediction history, evaluation-backed performance/calibration, and current safety mode. The API rejects mutation requests, exposes no wallet/signing/order path, and keeps paper P&L explicitly `UNAVAILABLE_UNTIL_PHASE_12` with `execution_available=false` and `paper_execution_available=false`.

Production acceptance uncovered and corrected three host-only deployment/read-model defects without weakening safety: the temporary Node npm probe needed the downloaded Node directory in `PATH`; feed health had to derive from the recorder's authoritative compact `market_state_1s` evidence when the unused `feed_status` table was empty; and the initial compact-state fallback had to use bounded latest-row lookups rather than a full-table aggregate scan. Regression tests cover those cases. The final isolated host acceptance returned `PHASE11_HOST_ACCEPTANCE=PASS` with 4 active markets, 4 feed rows, 2 performance rows, 26 prediction-history rows, zero evaluated predictions, localhost-only candidate listeners, and the recorder active.

Permanent installation on the same SHA returned `PHASE11_INSTALL=PASS`. Node `v24.20.0` was checksum-verified; `bp-recorder`, PostgreSQL, dashboard API, and dashboard web were active after installation; listeners remained only `127.0.0.1:8787` and `127.0.0.1:3000`; API health reported `RESEARCH` with live trading disabled; and POST mutation requests returned HTTP 405. Zero evaluated predictions remains valid append-only evidence and is not converted into a performance or profitability claim.

Sanitized closeout evidence is stored in `docs/evidence/phase-11-closeout-20260828.json`. Phase 12 — Paper Execution — is now the next permitted build-order phase. It must simulate bid/ask, depth, partial fills, latency, slippage, cancellations, expiry, and fees through the same interface intended for later live trading, reconcile paper trades to immutable signals, and surface paper execution/P&L diagnostics through the dashboard. Live trading remains disabled and still requires the later live-readiness gate plus explicit user authorization.

'''
          if "## 0.11.0 — 28 August 2026" not in changelog_text:
              changelog_text = changelog_text.replace("# Changelog\n\n", "# Changelog\n\n" + section, 1)
          changelog.write_text(changelog_text, encoding="utf-8")

          # The one-shot closeout workflow deletes itself so no persistent automation is added.
          Path(".github/workflows/phase11-closeout.yml").unlink()
          PY

          python -m json.tool PROJECT_STATE.json >/dev/null
          python -m json.tool docs/evidence/phase-11-closeout-20260828.json >/dev/null

          git diff --check
          git diff -- PROJECT_STATE.json START-HERE.md README.md docs/CHANGELOG.md docs/evidence/phase-11-closeout-20260828.json

      - name: Commit closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Dtwosam"
          git config user.email "42391449+Dtwosam@users.noreply.github.com"
          git add -A
          git commit -m "docs: close phase11 dashboard"
          git push origin HEAD:phase-11-dashboard-v1
