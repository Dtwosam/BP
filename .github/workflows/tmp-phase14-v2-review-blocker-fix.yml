name: Temporary Phase 14 V2 review blocker fix

on:
  push:
    branches:
      - phase14-v2-gate-b-label-gap-recovery-20260910
    paths:
      - .github/workflows/tmp-phase14-v2-review-blocker-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14-v2-gate-b-label-gap-recovery-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply and verify review fixes
        run: |
          python .github/tmp_phase14_v2_review_blocker_fix.py
          bash -n scripts/deploy/phase14_v2_gate_b_resume_cloudshell.sh
          pytest tests/v2_research/test_gate_b_recovery_review_guards.py tests/v2_research/test_gate_b_label_recovery.py tests/v2_research/test_gate_b_label_recovery_cli.py tests/deploy/test_phase14_v2_gate_b_label_recovery.py -q
          ruff check src/bp_engine/v2_research/label_recovery.py src/bp_engine/v2_research/label_recovery_cli.py tests/v2_research/test_gate_b_recovery_review_guards.py tests/v2_research/test_gate_b_label_recovery.py
          git diff --check
      - name: Commit review fixes and remove temporary files
        run: |
          rm .github/tmp_phase14_v2_review_blocker_fix.py
          rm .github/workflows/tmp-phase14-v2-review-blocker-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix Gate B one-shot and label provenance review blockers"
          git push origin HEAD:phase14-v2-gate-b-label-gap-recovery-20260910

# Retriggered after lint-only review guard formatting correction.
