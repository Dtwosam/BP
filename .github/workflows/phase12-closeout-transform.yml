name: Phase 12 Closeout Transform

on:
  push:
    branches:
      - phase-12-paper-execution-v1

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply closeout
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          op = '159ce77af9a51ae208511d216bee52d5732cee3b'
          pred = '0d452c12351560d41a69a0f90153c24acb401c8179861ac50074801b21d45e06'
          host_ev = '/var/lib/bp/evidence/phase12-paper-execution/20260828T230531Z'
          install_ev = '/var/lib/bp/evidence/phase12-install-20260828T234109Z.txt'
          close_ev = 'docs/evidence/phase-12-closeout-20260828.json'

          p = root / 'PROJECT_STATE.json'
          s = json.loads(p.read_text())
          assert s['source_of_truth_version'] == '0.11.0'
          assert s['current_phase'] == 12
          assert s['status'] == 'PHASE_11_COMPLETE_PHASE_12_READY'
          assert 'phase_12_checkpoint' not in s
          s['source_of_truth_version'] = '0.12.0'
          s['updated_at'] = '2026-08-28T23:41:09Z'
          s['current_phase'] = 13
          s['current_phase_name'] = 'improvement loop'
          s['status'] = 'PHASE_12_COMPLETE_PHASE_13_READY'
          s['phase_12_checkpoint'] = {
              'host_accepted_operational_commit': op,
              'ci_run': 1328,
              'ci_passed': True,
              'automated_tests_passing': 564,
              'host_acceptance_verdict': 'PASS',
              'permanent_install_verdict': 'PASS',
              'prospective_kind': 'TRADE',
              'prospective_prediction_id': pred,
              'paper_orders': 3,
              'paper_fills': 2,
              'paper_settlements': 0,
              'trade_signal_count': 3,
              'no_trade_signal_count': 51,
              'current_cash_usd': '92.207577336709',
              'realized_pnl_usd': '0.0',
              'reconciliation_status': 'OK',
              'reconciliation_violation_count': 0,
              'idempotent_rerun_verified': True,
              'causal_book_replay_required': True,
              'replay_indexes_ready': True,
              'paper_once_timeout_seconds': 120,
              'postgres_password_rotation_after_exposure': 'PASS',
              'paper_worker_active_after_install': True,
              'recorder_active_after_install': True,
              'postgres_active_after_install': True,
              'dashboard_api_active_after_install': True,
              'dashboard_web_active_after_install': True,
              'paper_execution_available': True,
              'execution_available': False,
              'live_trading_enabled': False,
              'max_trade_size_usd': 0,
              'max_daily_loss_usd': 0,
              'money_execution_path_added': False,
              'profitability_claim': False,
              'host_evidence_dir': host_ev,
              'install_evidence_file': install_ev,
              'sanitized_evidence': close_ev,
          }
          additions = [
              'Phase 12 generic execution protocol and deterministic money-disabled paper broker implemented',
              'Phase 12 causal order-book replay and realistic paper fill lifecycle implemented with fail-closed invalid-book handling',
              'Phase 12 dashboard paper account, order/fill/settlement, P&L, and reconciliation surfaces implemented without real execution controls',
              'Phase 12 production host acceptance passed on the exact operational commit with a genuine prospective trade, causal fill evidence, nonnegative cash, reconciliation OK, and idempotent rerun',
              'Phase 12 permanent production install passed with the money-disabled paper worker plus recorder, PostgreSQL, dashboard API, and dashboard web all active',
              'Phase 12 closeout evidence recorded',
          ]
          for item in additions:
              if item not in s['completed']:
                  s['completed'].append(item)
          s['not_completed'] = [x for x in s.get('not_completed', []) if x != 'Paper trading']
          if 'Live trading' not in s['not_completed']:
              s['not_completed'].append('Live trading')
          s['next_actions'] = [
              'Begin Phase 13 Improvement Loop',
              'Run hypothesis-driven champion/challenger experiments using immutable historical and prospective paper-execution evidence',
              'Evaluate calibration, executable edge, abstention, timing, feature, and model changes without reusing untouched holdouts for selection',
              'Promote no challenger unless repeated out-of-sample evidence beats the current champion after executable-price costs and uncertainty',
              'Keep LIVE_TRADING_ENABLED=false and real-money limits at zero; Phase 14 live-readiness and explicit authorization remain mandatory before real trading',
          ]
          s['security']['production_database_credential_rotated_after_phase12_exposure'] = True
          p.write_text(json.dumps(s, indent=2) + '\n')

          evidence = {
              'phase': 12,
              'name': 'Paper Execution',
              'date': '2026-08-28',
              'operational_commit': op,
              'ci': {'run_number': 1328, 'passed': True, 'python_tests': 564, 'dashboard_test_typecheck_build': 'PASS', 'deployment_validation': 'PASS'},
              'security_recovery': {'postgres_password_rotation_after_exposure': 'PASS', 'database_url_removed_from_phase12_process_argv': True, 'bp_env_file_indirection': True},
              'isolated_host_acceptance': {'verdict': 'PASS', 'head': op, 'prospective_kind': 'TRADE', 'prospective_prediction_id': pred, 'reconciliation_status': 'OK', 'idempotent_rerun': 'PASS', 'recorder_status': 'active', 'postgres_status': 'active', 'dashboard_api_status': 'active', 'dashboard_web_status': 'active', 'evidence_dir': host_ev},
              'permanent_install': {'verdict': 'PASS', 'head': op, 'paper_worker_status': 'active', 'dashboard_api_status': 'active', 'dashboard_web_status': 'active', 'recorder_status': 'active', 'postgres_status': 'active', 'paper_orders': 3, 'paper_fills': 2, 'paper_settlements': 0, 'trade_signal_count': 3, 'no_trade_signal_count': 51, 'current_cash_usd': '92.207577336709', 'realized_pnl_usd': '0.0', 'reconciliation': {'status': 'OK', 'violation_count': 0, 'all_recorded_violation_counters_zero': True}, 'paper_execution_available': True, 'real_execution_available': False, 'evidence_file': install_ev},
              'production_hardening': {'causal_full_book_replay': True, 'invalid_or_crossed_book_fails_order_closed_without_worker_crash': True, 'replay_specific_postgres_indexes_ready': True, 'paper_once_timeout_seconds': 120, 'synthetic_or_midpoint_fills_allowed': False},
              'safety': {'trading_mode': 'RESEARCH', 'live_trading_enabled': False, 'max_trade_size_usd': 0, 'max_daily_loss_usd': 0, 'wallet_or_signer_added': False, 'real_order_side_effects_enabled': False, 'profitability_claim': False},
              'interpretation': 'Phase 12 proves deterministic simulated execution and reconciliation against immutable live prediction signals on the production host. Paper fills and P&L are simulated evidence, not proof of live profitability. Phase 13 is next; live trading remains blocked by Phase 14 readiness plus explicit authorization.',
          }
          ep = root / close_ev
          ep.parent.mkdir(parents=True, exist_ok=True)
          ep.write_text(json.dumps(evidence, indent=2) + '\n')

          ch = root / 'docs/CHANGELOG.md'
          old = ch.read_text()
          assert old.startswith('# Changelog\n')
          assert '## 0.12.0 — 28 August 2026' not in old
          notes = '\n'.join([
              '## 0.12.0 — 28 August 2026',
              '',
              'Phase 12 — Paper Execution — closed after exact-head CI, isolated production-host acceptance, and permanent installation on operational candidate `159ce77af9a51ae208511d216bee52d5732cee3b`. CI run #1328 passed 564 Python tests, Ruff, deployment validation, health in research/live-disabled mode, and the dashboard test/typecheck/production-build lane.',
              '',
              'The phase adds a generic execution contract and deterministic paper broker tied only to immutable eligible 5m/15m live-prediction signals. Simulated orders model latency, executable selected-side ask, limit price, recorded depth, partial fills, fees, slippage, expiry/cancellation, cash accounting, terminal events, and official-outcome-only settlement. Causal fills use immutable Polymarket book evidence; midpoint, synthetic, future, or fabricated fills remain forbidden.',
              '',
              'Production debugging kept crossed/locked reconstructed books fail-closed per order, added replay-specific PostgreSQL indexes, and bounded deployment paper passes to 120 seconds. A previously exposed production database credential was rotated, and Phase 12 stopped passing `DATABASE_URL` through process argv in favor of `BP_ENV_FILE` indirection.',
              '',
              'Isolated host acceptance returned `PHASE12_HOST_ACCEPTANCE=PASS` with a genuine prospective `TRADE`, causal paper-fill evidence, reconciliation `OK`, an idempotent rerun, nonnegative cash, and recorder/PostgreSQL/dashboard continuity. Permanent installation returned `PHASE12_INSTALL=PASS` on the same SHA with the money-disabled paper worker active.',
              '',
              'The installed dashboard reported `paper_execution_available=true`, `execution_available=false`, current cash `92.207577336709`, realized P&L `0.0`, 3 paper orders, 2 paper fills, 0 settlements, and reconciliation `OK` with every recorded violation counter at zero. These are simulated execution results, not a live-profitability claim.',
              '',
              'Sanitized closeout evidence is stored in `docs/evidence/phase-12-closeout-20260828.json`. Phase 13 — Improvement Loop — is now the next permitted phase. Live trading remains disabled, real-money limits remain zero, and Phase 14 live-readiness plus explicit authorization remain mandatory before real order placement.',
              '',
          ])
          ch.write_text('# Changelog\n\n' + notes + old[len('# Changelog\n'):].lstrip('\n'))

          st = root / 'START-HERE.md'
          old = st.read_text()
          marker = '## Current next step\n'
          assert marker in old
          tail = '\n'.join([
              '## Current next step',
              '',
              'Phase 13: begin the **Improvement Loop**. Phase 12 — Paper Execution — is production-host accepted and permanently installed on exact operational candidate `159ce77af9a51ae208511d216bee52d5732cee3b`.',
              '',
              'Fresh exact-head Phase 12 CI run #1328 passed 564 Python tests plus Ruff, deployment validation, health, dashboard tests, strict TypeScript typecheck, and the Next.js production build. Host acceptance and permanent install both passed; paper execution is available, real execution remains unavailable, cash is nonnegative, and reconciliation has zero violations.',
              '',
              'Phase 13 must use explicit hypotheses and champion/challenger experiments. Candidate model, calibration, timing, feature, or abstention changes must be judged on permitted out-of-sample evidence and executable-price economics; untouched holdouts must not be reused for selection, and one unusually good backtest cannot promote a challenger.',
              '',
              '`LIVE_TRADING_ENABLED=false`, maximum real trade size and daily loss remain zero, and no wallet/signing/order-placement path is authorized. Phase 14 live readiness and explicit authorization remain mandatory before real-money trading.',
              '',
          ])
          st.write_text(old.split(marker, 1)[0] + tail)

          rd = root / 'README.md'
          old = rd.read_text()
          old = old.replace('**Phases 0–11:** complete.', '**Phases 0–12:** complete.')
          old = old.replace('**Current phase:** Phase 12 — Paper Execution.', '**Current phase:** Phase 13 — Improvement Loop.')
          a = old.index('Phase 11 is production-host accepted')
          b = old.index('\n\n## Read before working', a)
          intro = 'Phase 12 is production-host accepted and permanently installed on exact operational candidate `159ce77af9a51ae208511d216bee52d5732cee3b`. The production system now has deterministic money-disabled paper execution reconciled to immutable 5m/15m signals, while real execution remains unavailable. Accepted paper evidence includes 3 orders, 2 fills, nonnegative cash, and reconciliation `OK` with zero violations. These are simulated results, not a live-profitability claim. Phase 13 now focuses on disciplined hypothesis-driven improvement; the ~80% accuracy discussed for this project remains a research target, not an assumed or guaranteed capability.'
          old = old[:a] + intro + old[b:]
          old = old.replace('- Phase 11 Dashboard V1 is accepted and remains a read-only surface.\n- Phase 12 is the current paper-execution phase; simulated fills must reconcile to immutable signals and must never place real orders.', '- Phase 12 Paper Execution is accepted and permanently installed; paper fills must remain causal and reconciled to immutable signals.\n- Phase 13 is the current Improvement Loop; promote changes only through explicit hypotheses and repeated out-of-sample champion/challenger evidence.')
          proof = '## Accepted Phase 11 proof\n'
          assert proof in old
          proof_text = '\n'.join([
              '## Accepted Phase 12 proof',
              '',
              'Fresh exact-head CI passed on `159ce77af9a51ae208511d216bee52d5732cee3b` (run #1328): 564 Python tests passed, Ruff/deployment validation/health passed, and the dashboard test/typecheck/Next.js production build lane passed.',
              '',
              'Isolated production-host acceptance returned `PHASE12_HOST_ACCEPTANCE=PASS` with a genuine prospective trade, causal paper evidence, reconciliation `OK`, and an idempotent rerun. Permanent installation returned `PHASE12_INSTALL=PASS` on the same SHA. `bp-paper-execution`, recorder, PostgreSQL, dashboard API, and dashboard web were active; paper execution was available, real execution unavailable, current cash was `92.207577336709`, and reconciliation had zero violations.',
              '',
              'Sanitized evidence is in `docs/evidence/phase-12-closeout-20260828.json`. The next task is Phase 13 Improvement Loop. Live trading remains disabled and still requires Phase 14 readiness plus explicit authorization.',
              '',
          ])
          rd.write_text(old.split(proof, 1)[0] + proof_text)

          bo = root / 'docs/BUILD-ORDER.md'
          old = bo.read_text()
          marker = '## Immediate next action\n'
          assert marker in old
          tail = '\n'.join([
              '## Immediate next action',
              '',
              '**Build Phase 13 — Improvement Loop.**',
              '',
              'Phase 12 is production-host accepted and permanently installed on exact operational candidate `159ce77af9a51ae208511d216bee52d5732cee3b`, with a genuine prospective trade, causal paper fills, idempotent reconciliation, nonnegative cash, and zero reconciliation violations. The permanent paper worker is active while real execution remains unavailable.',
              '',
              'Phase 13 must test explicit hypotheses across features, models, calibration, prediction timing, abstention, and executable-edge assumptions using champion/challenger discipline. Do not retune against untouched holdouts and do not promote from one unusually good backtest.',
              '',
              'Live readiness remains Phase 14. `LIVE_TRADING_ENABLED=false`, real-money limits remain zero, and no wallet/signing/order-placement path is authorized before that later gate and explicit user authorization.',
              '',
          ])
          bo.write_text(old.split(marker, 1)[0] + tail)
          PY

          python -m json.tool PROJECT_STATE.json >/dev/null
          python -m json.tool docs/evidence/phase-12-closeout-20260828.json >/dev/null
          grep -q PHASE_12_COMPLETE_PHASE_13_READY PROJECT_STATE.json
          grep -q 'Build Phase 13' docs/BUILD-ORDER.md
          grep -q '## 0.12.0' docs/CHANGELOG.md
          grep -q 'Accepted Phase 12 proof' README.md

      - name: Commit closeout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.json START-HERE.md README.md docs/BUILD-ORDER.md docs/CHANGELOG.md docs/evidence/phase-12-closeout-20260828.json
          git diff --cached --check
          git commit -m 'docs: close phase12 paper execution'
          git push origin HEAD:phase-12-paper-execution-v1
