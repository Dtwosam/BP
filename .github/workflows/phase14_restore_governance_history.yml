name: Phase 14 Restore Governance History

on:
  push:
    branches:
      - phase14-prospective-outcome-sync
    paths:
      - scripts/dev/restore_phase14_governance_history.py

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main baseline
        run: git fetch --no-tags origin main

      - name: Restore immutable history and keep follow-up additions
        run: python scripts/dev/restore_phase14_governance_history.py

      - name: Commit restored governance history
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md docs/DECISION-LOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No history restoration required"
            exit 0
          fi
          git commit -m "docs: restore governance history before outcome sync additions"
          git push origin HEAD:phase14-prospective-outcome-sync
