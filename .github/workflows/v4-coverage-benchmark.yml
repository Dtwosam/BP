name: V4 Coverage Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/v4-coverage-benchmark.yml"
      - "scripts/benchmark_v4_forward_coverage.py"
      - "src/bp_engine/features/v4_coverage.py"
      - "src/bp_engine/features/v4_forward.py"
      - "tests/features/test_v4_coverage.py"
      - "tests/features/test_v4_forward.py"

permissions:
  contents: read

jobs:
  coverage-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp_dev_only
          POSTGRES_DB: bp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bp -d bp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BP_TEST_DATABASE_URL: postgresql+psycopg://bp:bp_dev_only@localhost:5432/bp
      BP_V4_COVERAGE_BENCHMARK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated benchmark dependencies
        run: python -m pip install -e .
      - name: Compare full audit and invariant-equivalent forward summary
        run: python scripts/benchmark_v4_forward_coverage.py
