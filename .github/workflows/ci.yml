name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp_dev_only
          POSTGRES_DB: bp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bp -d bp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BP_TEST_DATABASE_URL: postgresql+psycopg://bp:bp_dev_only@localhost:5432/bp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          set -o pipefail
          pytest -vv --junitxml=pytest-results.xml 2>&1 | tee pytest-output.log

      - name: Stage B1 source-only pinned backport/reversal rehearsal
        run: |
          git fetch --no-tags --depth=1 origin a352c66ec0110925727bc40de767ee4ba981f965 75281f2b97f19d903f576b973bb7c2236179839e 347db08ee47d113f35fd6a9bc0e4bd85610aea0d
          python scripts/rehearse_stage_b1_backport.py | tee stage-b1-backport.json

      - name: Stage B1 deterministic inert review bundle (offline)
        run: |
          set -o pipefail
          python scripts/rehearse_stage_b1_review_bundle.py | tee stage-b1-review-bundle.json
          python -c 'import json; d=json.load(open("stage-b1-review-bundle.json")); assert d["status"] == "PASS_OFFLINE_REVIEW_ONLY_NO_GO" and d["bundle_integrity_rechecked"] and d["source_byte_exact_reverse_verified"] and not d["production_execution_authorized"]'

      - name: Stage B1 offline preflight template must fail closed
        run: |
          set -euo pipefail
          exit_status=0
          python scripts/review_stage_b1_preflight_manifest.py --manifest docs/evidence/phase14-b1-INCOMPLETE-offline-preflight-template-20261013.json > stage-b1-preflight-NO-GO.json || exit_status=$?
          test "$exit_status" -eq 2
          python -c 'import json; d=json.load(open("stage-b1-preflight-NO-GO.json")); assert d["status"] == "INCOMPLETE_OR_MISMATCHED_NO_GO" and not d["production_execution_authorized"] and not d["host_claims_independently_verified"]'

      - name: Stage B1 pinned recorder source feasibility (NO GO)
        run: |
          set -euo pipefail
          python -m pytest -q tests/recorder/test_stage_b1_operator_feasibility.py
          status=0
          python scripts/review_stage_b1_operator_feasibility.py > stage-b1-pinned-operator-NO-GO.json || status=$?
          test "$status" -eq 2
          python -c 'import json; x=json.load(open("stage-b1-pinned-operator-NO-GO.json")); assert x["status"]=="PINNED_SOURCE_REVIEW_ONLY_NO_GO" and x["file_count"]==5 and all(x["checks"].values()) and not x["on_host_identity_verified"] and not x["safe_existing_recorder_restart_candidate_available"] and not x["safe_parallel_full_recorder_candidate_available"] and not x["db_thread_quiescence_verified"] and not x["production_execution_authorized"]'

      - name: Stage B1 lifecycle/restoration review must remain NO GO
        run: |
          set -euo pipefail
          python -m pytest -q tests/recorder/test_stage_b1_lifecycle_contract.py
          exit_status=0
          python scripts/review_stage_b1_lifecycle_contract.py --manifest docs/evidence/phase14-b1-INCOMPLETE-lifecycle-review-template-20261014.json > stage-b1-lifecycle-review-NO-GO.json || exit_status=$?
          test "$exit_status" -eq 2
          python -c 'import json; d=json.load(open("stage-b1-lifecycle-review-NO-GO.json")); assert d["status"]=="INCOMPLETE_OR_INVALID_NO_GO" and d["total_gate_count"]==17 and d["claimed_gate_count"]==0 and not d["claims_independently_authenticated"] and not d["production_execution_authorized"] and not d["production_deploy_or_restart_permitted"] and not d["actual_db_worker_quiescence_verified"] and not d["actual_systemd_restoration_verified"]'

      - name: Stage B1 isolated fake process timeout rehearsal
        run: |
          python scripts/rehearse_stage_b1_process_boundary.py --scenario cooperative | tee stage-b1-process-cooperative.json
          python scripts/rehearse_stage_b1_process_boundary.py --scenario ignore_term | tee stage-b1-process-ignore-term.json
          python scripts/rehearse_stage_b1_process_boundary.py --scenario leader_exits_descendant_ignores_term | tee stage-b1-process-orphan-kill.json
          python -c 'import json; x=json.load(open("stage-b1-process-orphan-kill.json")); assert x["termination"] == "descendant_sigkill" and x["known_fixture_group_pipe_eof"] and x["process_leader_reaped"] and not x["fixed_synthetic_aggregate_valid"] and not x["production_execution_authorized"]'

      - name: Stage B1 fake supervisor cancellation cleanup regression
        run: |
          python -m pytest -q tests/recorder/test_stage_b1_process_boundary.py::test_cancelled_supervisor_reaps_live_fake_descendant tests/recorder/test_stage_b1_process_boundary.py::test_cancelled_supervisor_reaps_hanging_fake_leader

      - name: Stage B1 fake to-thread DB cancellation witness (NO GO)
        run: |
          set -euo pipefail
          python -m pytest -q tests/recorder/test_stage_b1_db_thread_boundary.py
          python scripts/rehearse_stage_b1_db_thread_boundary.py --scenario late_success > stage-b1-fake-thread-success.json
          python scripts/rehearse_stage_b1_db_thread_boundary.py --scenario late_failure > stage-b1-fake-thread-failure.json
          python -c 'import json; a=json.load(open("stage-b1-fake-thread-success.json")); b=json.load(open("stage-b1-fake-thread-failure.json")); assert a["fake_transaction_outcome_after_release"]=="fake_committed" and b["fake_transaction_outcome_after_release"]=="fake_rolled_back"; assert all(x["awaiting_task_cancelled"] and x["fake_worker_pending_after_task_cancellation"] and x["fake_worker_finished_after_release"] and x["writer_batches_cancelled_unresolved"]==1 and x["writer_batches_in_flight_conservative"]==1 and x["writer_batches_returned"]==0 and x["writer_attempts_marked_committed"]==0 and not x["actual_database_commit_or_rollback_proven"] and not x["production_db_threads_terminated_proven"] and not x["systemd_restore_proven"] and not x["production_execution_authorized"] for x in (a,b))'

      - name: Stage B1 independent fake service restoration readback (NO GO)
        run: |
          set -euo pipefail
          python -m pytest -q tests/recorder/test_stage_b1_fake_service_restoration.py
          python scripts/rehearse_stage_b1_fake_service_restoration.py --scenario restored > stage-b1-fake-restore-matched.json
          python scripts/rehearse_stage_b1_fake_service_restoration.py --scenario ack_only > stage-b1-fake-restore-ack-only.json
          python scripts/rehearse_stage_b1_fake_service_restoration.py --scenario stale_readback > stage-b1-fake-restore-stale.json
          python scripts/rehearse_stage_b1_fake_service_restoration.py --scenario db_worker_pending > stage-b1-fake-restore-worker.json
          python -c 'import json; files=["stage-b1-fake-restore-matched.json","stage-b1-fake-restore-ack-only.json","stage-b1-fake-restore-stale.json","stage-b1-fake-restore-worker.json"]; rows=[json.load(open(p)) for p in files]; assert rows[0]["status"]=="FAKE_READBACK_MATCH_UNVERIFIED_NO_GO" and all(rows[0]["checks"].values()); assert all(x["status"]=="FAKE_RESTORE_MISMATCH_NO_GO" for x in rows[1:]); assert rows[1]["checks"]["restore_ack_received"] and not rows[1]["checks"]["service_active"]; assert not rows[2]["checks"]["fresh_separate_readback"]; assert not rows[3]["checks"]["no_known_fake_db_workers"]; assert all(not x["actual_systemd_restoration_proven"] and not x["actual_db_thread_quiescence_proven"] and not x["production_execution_authorized"] for x in rows)'

      - name: Stage B1 synthetic diagnostic equivalence (NO GO)
        run: |
          set -euo pipefail
          python -m pytest -q tests/recorder/test_stage_b1_observability_equivalence.py
          python scripts/review_stage_b1_observability_equivalence.py --view separate_wire_only > stage-b1-equivalence-independent-probe.json
          python scripts/review_stage_b1_observability_equivalence.py --view same_recorder_dormant_b1 > stage-b1-equivalence-recorder.json
          python scripts/review_stage_b1_observability_equivalence.py --view same_recorder_plus_verified_postcommit > stage-b1-equivalence-hypothetical-receipts.json
          python -c 'import json; files=("stage-b1-equivalence-independent-probe.json","stage-b1-equivalence-recorder.json","stage-b1-equivalence-hypothetical-receipts.json"); rows=[json.load(open(f)) for f in files]; assert [x["ambiguous_hypothesis_pair_count"] for x in rows]==[15,1,0]; assert [x["equivalence_class_count"] for x in rows]==[1,5,6]; assert all(x["status"]=="FIXED_SYNTHETIC_DECISION_REVIEW_NO_GO" and x["separate_probe_is_not_same_recorder_evidence"] and x["same_recorder_counts_are_hypothetical"] and not x["production_root_cause_identified"] and not x["production_execution_authorized"] and not x["independent_stop_restoration_verified"] for x in rows)'

      - name: Stage B1 inert bulk wire-only fixed fake (NO GO)
        run: |
          set -euo pipefail
          python -m pytest -q tests/recorder/test_stage_b1_inert_wire_only.py
          python scripts/rehearse_stage_b1_inert_wire_only.py --scenario bulk_all > stage-b1-wire-only-bulk.json
          python scripts/rehearse_stage_b1_inert_wire_only.py --scenario ack_only > stage-b1-wire-only-ack.json
          python scripts/rehearse_stage_b1_inert_wire_only.py --scenario parse_failure > stage-b1-wire-only-error.json
          python scripts/rehearse_stage_b1_inert_wire_only.py --scenario ticker_excluded > stage-b1-wire-only-ticker.json
          python -c 'import json; a=json.load(open("stage-b1-wire-only-bulk.json")); b=json.load(open("stage-b1-wire-only-ack.json")); c=json.load(open("stage-b1-wire-only-error.json")); d=json.load(open("stage-b1-wire-only-ticker.json")); xs=(a,b,c,d); assert a["fake_wire_messages_by_class"]=={"trade":1,"orderbook":1,"liquidation":1,"other":0} and a["fake_discarded_events_not_written"]==3; assert b["classification"]=="fake_no_bulk_frames" and b["fake_subscribe_ack_socket_outcome"]["success"]==1; assert c["classification"]=="fake_parser_exception" and c["fake_parser_errors"]==1; assert d["fake_discarded_events_not_written"]==1 and sum(d["fake_parsed_events_by_class"].values())==0; assert all(x["status"]=="OFFLINE_FIXED_FAKE_WIRE_ONLY_NO_GO" and not x["real_exchange_frames_received"] and not x["per_topic_subscription_accepted_proven"] and not x["database_write_or_commit_proven"] and not x["production_execution_authorized"] for x in xs)'

      - name: Stage B1 real recorder pipeline with fake in-memory socket only
        run: |
          set -o pipefail
          python scripts/rehearse_stage_b1_real_pipeline_offline.py --scenario healthy | tee stage-b1-fake-pipeline-healthy.json
          python scripts/rehearse_stage_b1_real_pipeline_offline.py --scenario writer_failure | tee stage-b1-fake-pipeline-failed.json
          python -c 'import json; ok=json.load(open("stage-b1-fake-pipeline-healthy.json")); fail=json.load(open("stage-b1-fake-pipeline-failed.json")); assert ok["status"] == "COMPLETE_AGGREGATES_ONLY" and ok["counts"]["writer_batches_returned"] == 3 and not ok["inserted_rows_by_class_proven"]; assert fail["status"] == "INCONCLUSIVE" and not fail["production_execution_authorized"]'

      - name: Stage B1 real local PostgreSQL postcommit cost (non-gating)
        run: |
          set -o pipefail
          python -m pytest -q -s tests/storage/test_partitioned_raw_postgres.py::test_b1_attribution_benchmark_local_pg_non_gating | tee stage-b1-attribution-benchmark-output.log
          python -c 'import json; lines=open("stage-b1-attribution-benchmark-output.log").read().splitlines(); matching=[s.split("B1_ATTRIBUTION_BENCHMARK_JSON=",1)[1] for s in lines if "B1_ATTRIBUTION_BENCHMARK_JSON=" in s]; assert len(matching)==1; d=json.loads(matching[0]); assert d["status"]=="LOCAL_ONLY_NOT_PRODUCTION_ACCEPTANCE" and not d["production_overhead_accepted"] and d["transaction_count"]==18; open("stage-b1-attribution-benchmark.json","w").write(json.dumps(d,sort_keys=True))'

      - name: Stage B1 offline recorder queue and writer overhead (non-gating)
        run: |
          set -o pipefail
          python scripts/benchmark_stage_b1_recorder_queue_offline.py --repeats 3 | tee stage-b1-recorder-queue-overhead.json
          python -c 'import json; d=json.load(open("stage-b1-recorder-queue-overhead.json")); assert d["status"] == "LOCAL_SYNTHETIC_NON_GATING_NO_GO" and not d["production_overhead_accepted"] and not d["production_execution_authorized"] and [x["worker_count"] for x in d["measurements"]] == [1, 3]'

      - name: Stage B1 synthetic overhead (non-gating)
        run: |
          set -o pipefail
          python scripts/benchmark_stage_b1_observer.py --iterations 2000 --repeats 5 | tee stage-b1-overhead.json

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-results.xml
            pytest-output.log
            stage-b1-overhead.json
            stage-b1-attribution-benchmark.json
            stage-b1-recorder-queue-overhead.json
            stage-b1-backport.json
            stage-b1-review-bundle.json
            stage-b1-fake-pipeline-healthy.json
            stage-b1-fake-pipeline-failed.json
            stage-b1-preflight-NO-GO.json
            stage-b1-lifecycle-review-NO-GO.json
            stage-b1-pinned-operator-NO-GO.json
            stage-b1-process-cooperative.json
            stage-b1-process-ignore-term.json
            stage-b1-process-orphan-kill.json
            stage-b1-fake-thread-success.json
            stage-b1-fake-thread-failure.json
            stage-b1-fake-restore-matched.json
            stage-b1-fake-restore-ack-only.json
            stage-b1-fake-restore-stale.json
            stage-b1-fake-restore-worker.json
            stage-b1-wire-only-bulk.json
            stage-b1-wire-only-ack.json
            stage-b1-wire-only-error.json
            stage-b1-wire-only-ticker.json
            stage-b1-equivalence-independent-probe.json
            stage-b1-equivalence-recorder.json
            stage-b1-equivalence-hypothetical-receipts.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate deployment assets
        run: |
          bash -n scripts/deploy/bootstrap_ubuntu.sh
          bash -n scripts/deploy/phase2_soak_report.sh
          bash -n scripts/deploy/phase4_host_acceptance.sh
          bash -n scripts/deploy/phase4_host_post_resize_accept.sh
          bash -n scripts/deploy/phase4_cloudshell_expand_and_accept.sh
          bash -n scripts/deploy/phase5_host_acceptance.sh
          bash -n scripts/deploy/phase5_cloudshell_accept.sh
          bash -n scripts/deploy/phase6_host_acceptance.sh
          bash -n scripts/deploy/phase6_cloudshell_accept.sh
          bash -n scripts/deploy/phase7_host_acceptance.sh
          bash -n scripts/deploy/phase7_cloudshell_accept.sh
          bash -n scripts/deploy/phase8_host_acceptance.sh
          bash -n scripts/deploy/phase8_cloudshell_accept.sh
          bash -n scripts/deploy/phase9_host_acceptance.sh
          bash -n scripts/deploy/phase9_cloudshell_accept.sh
          bash -n scripts/deploy/phase10_host_acceptance.sh
          bash -n scripts/deploy/phase10_cloudshell_accept.sh
          bash -n scripts/deploy/phase11_host_acceptance.sh
          bash -n scripts/deploy/phase11_cloudshell_accept.sh
          bash -n scripts/deploy/phase11_install.sh
          bash -n scripts/deploy/phase12_host_acceptance.sh
          bash -n scripts/deploy/phase12_cloudshell_accept.sh
          bash -n scripts/deploy/phase12_install.sh
          bash -n scripts/deploy/phase12_rotate_postgres_password.sh
          bash -n scripts/deploy/phase13_host_acceptance.sh
          bash -n scripts/deploy/phase13_cloudshell_accept.sh
          bash -n scripts/deploy/phase14_host_acceptance.sh
          bash -n scripts/deploy/phase14_cloudshell_accept.sh
          bash -n scripts/deploy/phase14_prospective_outcome_sync_cloudshell.sh
          bash -n scripts/deploy/phase14_prospective_runtime_install.sh
          bash -n scripts/deploy/phase14_prospective_runtime_cloudshell.sh
          bash -n scripts/deploy/phase14_recorder_reliability_rollout_cloudshell.sh
          bash -n scripts/deploy/phase14_recorder_restart_gate_cloudshell.sh
          bash -n scripts/deploy/phase14_recorder_deadlock_recovery_gate_cloudshell.sh
          bash -n scripts/deploy/phase14_dedupe_cleanup_recovery_gate_cloudshell.sh
          bash -n scripts/deploy/phase14_concurrent_partition_retirement_rollout_cloudshell.sh
          bash -n scripts/deploy/phase14_observation_cloudshell.sh
          bash -n scripts/deploy/phase14_compact_feed_freshness_index_cloudshell.sh
          bash -n scripts/deploy/phase14_v2_outcome_label_coverage_rollout_preflight_cloudshell.sh
          bash -n scripts/deploy/phase14_partitioned_storage_rollout_cloudshell.sh
          bash -n scripts/deploy/phase14_partitioned_storage_preflight_cloudshell.sh
          bash -n scripts/deploy/phase14_storage_preflight_evidence_cloudshell.sh
          bash -n scripts/deploy/phase14_v2_gate_a_rollout_cloudshell.sh
          bash -n scripts/deploy/phase14_v2_forward_coverage_rollout_cloudshell.sh
          bash -n scripts/deploy/phase14_v2_gate_b_readiness_watch_install_cloudshell.sh
          bash -n scripts/deploy/phase14_v4_fresh_book_shadow_closeout_cloudshell.sh
          python -m py_compile scripts/verify_v4_fresh_book_shadow_closeout.py
          bash -n scripts/deploy/phase15_v3_fast_live_manual_transition_preflight.sh
          bash -n scripts/deploy/phase15_v3_telegram_auto_approver_deactivate_operator.sh
          bash -n scripts/deploy/phase15_v3_telegram_auto_approver_continuous_preflight_operator.sh
          bash -n scripts/deploy/phase15_v3_telegram_auto_approver_upgrade_continuous_operator.sh
          python -m py_compile scripts/deploy/phase15_v3_fast_live_build_authorization_candidate.py
          python -m py_compile scripts/deploy/phase15_v3_fast_live_build_auto_authorization_candidate.py
          python -m py_compile scripts/deploy/ensure_phase12_replay_indexes.py
          python -m py_compile scripts/deploy/migrate_partitioned_raw_storage.py
          python -m py_compile scripts/deploy/verify_phase14_storage_preflight.py
          python -m py_compile scripts/run_live_prediction.py scripts/report_live_predictions.py scripts/run_dashboard_api.py
          python -m py_compile scripts/run_paper_execution.py
          python -m py_compile scripts/run_improvement.py
          python -m py_compile scripts/run_live_readiness.py
          python -m py_compile scripts/run_v2_forward_coverage.py
          python -m py_compile scripts/run_v2_gate_b_readiness_watch.py
          docker compose --env-file deploy/bp.env.example -f docker-compose.prod.yml config -q

      - name: Health check
        run: python -m bp_engine.health

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Install dashboard dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test dashboard
        run: npm test

      - name: Typecheck dashboard
        run: npm run typecheck

      - name: Build dashboard
        run: npm run build
