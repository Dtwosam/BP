name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Validate deployment assets
        run: |
          bash -n scripts/deploy/bootstrap_ubuntu.sh
          bash -n scripts/deploy/phase2_soak_report.sh
          docker compose --env-file deploy/bp.env.example -f docker-compose.prod.yml config -q

      - name: Health check
        run: python -m bp_engine.health
