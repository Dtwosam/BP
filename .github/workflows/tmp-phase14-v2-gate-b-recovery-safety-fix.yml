name: Temporary Phase 14 V2 Gate B recovery safety fix

on:
  push:
    branches:
      - phase14-v2-gate-b-label-gap-recovery-20260910
    paths:
      - .github/workflows/tmp-phase14-v2-gate-b-recovery-safety-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14-v2-gate-b-label-gap-recovery-20260910
          fetch-depth: 0
      - name: Apply and verify patch
        run: |
          python -c 'from pathlib import Path; p=Path(".github/tmp_phase14_v2_gate_b_recovery_safety_fix.py"); s=p.read_text(); old="    if count != 1:\n        raise SystemExit(f\"{label}: expected one anchor, found {count}\")\n"; new="    if count != 1 and not (label in {\"recovery local evidence echo\", \"resume local evidence echo\"} and count >= 1):\n        raise SystemExit(f\"{label}: expected one anchor, found {count}\")\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python .github/tmp_phase14_v2_gate_b_recovery_safety_fix.py
          bash -n scripts/deploy/phase14_v2_gate_b_label_recovery_cloudshell.sh
          bash -n scripts/deploy/phase14_v2_gate_b_resume_cloudshell.sh
          pytest tests/deploy/test_phase14_v2_gate_b_label_recovery.py tests/v2_research/test_gate_b_contract.py -q
          git diff --check
      - name: Commit patch and remove temporary files
        run: |
          rm .github/tmp_phase14_v2_gate_b_recovery_safety_fix.py
          rm .github/workflows/tmp-phase14-v2-gate-b-recovery-safety-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harden Gate B recovery storage and runtime guards"
          git push origin HEAD:phase14-v2-gate-b-label-gap-recovery-20260910
