name: Phase 14 Outcome Acceptance Governance Apply

on:
  push:
    branches:
      - phase14-prospective-outcome-sync
    paths:
      - scripts/dev/apply_phase14_outcome_acceptance_governance.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted governance updates
        run: python scripts/dev/apply_phase14_outcome_acceptance_governance.py

      - name: Commit governance files
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MASTER-SOURCE-OF-TRUTH.md docs/DECISION-LOG.md docs/CHANGELOG.md PROJECT_STATE.json
          if git diff --cached --quiet; then
            echo "No governance changes required"
            exit 0
          fi
          git commit -m "docs: record exercised outcome-sync acceptance gate"
          git push origin HEAD:phase14-prospective-outcome-sync
