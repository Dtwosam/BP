name: Close out Phase 14 V2 outcome-label rollout PASS

on:
  push:
    branches:
      - closeout/phase14-v2-outcome-label-rollout-preflight-pass
    paths:
      - .github/workflows/closeout-phase14-v2-outcome-label-rollout-pass.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply source-truth closeout
        run: python scripts/closeout_phase14_v2_outcome_label_rollout_pass.py
      - name: Verify focused contracts
        run: |
          ruff check tests/v2_research/test_gate_b_closeout_source_truth.py tests/v2_research/test_gate_b_contract.py
          pytest -q tests/v2_research/test_gate_b_closeout_source_truth.py tests/v2_research/test_gate_b_contract.py
          git diff --check
      - name: Remove one-shot automation and commit
        run: |
          git rm .github/workflows/closeout-phase14-v2-outcome-label-rollout-pass.yml
          git rm scripts/closeout_phase14_v2_outcome_label_rollout_pass.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.json docs/MASTER-SOURCE-OF-TRUTH.md docs/BUILD-ORDER.md docs/CHANGELOG.md tests/v2_research/test_gate_b_closeout_source_truth.py tests/v2_research/test_gate_b_contract.py
          git commit -m "Record Phase 14 outcome-label rollout PASS"
          git push origin HEAD:closeout/phase14-v2-outcome-label-rollout-preflight-pass
