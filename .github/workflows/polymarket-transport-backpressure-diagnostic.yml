name: Polymarket Transport Backpressure Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  active-burst-profile:
    if: github.head_ref == 'investigate-polymarket-transport-backpressure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - dynamic_active
          - fresh_initial_active
    env:
      POLYMARKET_BURST_SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify diagnostic
        run: ruff check scripts/diagnose_polymarket_dynamic_active_burst_profile.py

      - name: Profile first seconds after active subscribe
        run: python scripts/diagnose_polymarket_dynamic_active_burst_profile.py
