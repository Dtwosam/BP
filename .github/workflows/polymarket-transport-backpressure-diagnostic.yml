name: Polymarket Transport Backpressure Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  subscribe-trigger:
    if: github.head_ref == 'investigate-polymarket-transport-backpressure'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - dynamic_active
          - fresh_initial_active
          - dynamic_future
    env:
      POLYMARKET_SUBSCRIBE_SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify diagnostic
        run: ruff check scripts/diagnose_polymarket_transport_subscribe_trigger.py

      - name: Probe active subscribe trigger
        run: python scripts/diagnose_polymarket_transport_subscribe_trigger.py
