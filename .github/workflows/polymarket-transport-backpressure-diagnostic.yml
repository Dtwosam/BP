name: Polymarket Transport Backpressure Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dynamic-active-initial-dump:
    if: github.head_ref == 'investigate-polymarket-transport-backpressure'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        initial_dump:
          - "true"
          - "false"
    env:
      POLYMARKET_INITIAL_DUMP: ${{ matrix.initial_dump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify diagnostic
        run: ruff check scripts/diagnose_polymarket_dynamic_active_initial_dump.py

      - name: Compare active dynamic subscribe initial dump
        run: python scripts/diagnose_polymarket_dynamic_active_initial_dump.py
