name: Close out Phase14 V2 outcome-label rollout preflight

on:
  push:
    branches:
      - closeout/phase14-v2-outcome-label-rollout-preflight

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: closeout/phase14-v2-outcome-label-rollout-preflight
          fetch-depth: 1

      - name: Apply closeout
        run: python scripts/closeout_phase14_v2_outcome_label_rollout_preflight.py

      - name: Commit closeout and remove one-shot automation
        run: |
          git rm .github/workflows/closeout-phase14-v2-outcome-label-rollout-preflight.yml
          git rm scripts/closeout_phase14_v2_outcome_label_rollout_preflight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.json docs/MASTER-SOURCE-OF-TRUTH.md docs/BUILD-ORDER.md docs/CHANGELOG.md
          git diff --cached --check
          git commit -m "Close out V2 outcome-label rollout preflight state"
          git push origin HEAD:closeout/phase14-v2-outcome-label-rollout-preflight
