name: Polymarket Late Active Recovery Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-public-validation:
    if: github.head_ref == 'prototype-polymarket-late-active-reconnect'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify validation probe
        run: ruff check scripts/validate_polymarket_late_active_recovery.py
      - name: Run paired public websocket validation
        run: python scripts/validate_polymarket_late_active_recovery.py
