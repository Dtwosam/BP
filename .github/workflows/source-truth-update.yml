name: Source Truth Update

on:
  push:
    branches:
      - research/v3-gate-b-successor-runtime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply deterministic V3 successor handoff
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import UTC, datetime
          from pathlib import Path

          ROOT = Path('.')
          PLAN_V1 = 'v3-gate-b-preregister-v1'
          PLAN_V2 = 'v3-gate-b-preregister-v2'
          V1_START = '2026-09-13T13:45:00Z'
          V1_END = '2026-09-16T13:45:00Z'
          V2_START = '2026-09-16T13:45:00Z'
          V2_END = '2026-09-19T13:45:00Z'
          COVERAGE_SHA = '32c283a7769681ebe5b2e0d1fe255ad6c38aa5b0301303f8fe86f4e7b2278ffb'
          PREREG_COMMIT = 'c9e179c91ea990ca4a25a13f69fc5932811fb32a'
          RUNTIME_HEAD = '659d9524fe8bfeba182b7cf7c8d9b664280f7562'
          RUNTIME_CI = 34841954823

          # PROJECT_STATE.json: preserve all historical keys and add a successor current-state record.
          state_path = ROOT / 'PROJECT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          assert state['source_of_truth_version'] == '0.14.138'
          state['source_of_truth_version'] = '0.14.139'
          state['updated_at'] = datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          v3 = state['phase_14_btc_first_v3_gate_a']
          assert v3['research_plan_version'] == PLAN_V1
          assert 'successor_gate_b' not in v3
          v3['implementation_status'] = 'GATE_A_PASS_V3_GATE_B_SUCCESSOR_RUNTIME_IMPLEMENTED_PROSPECTIVE_COLLECTION'
          v3['next_action'] = (
              'Continue prospective core-v3-btc-native source/feature collection through '
              '2026-09-19T13:45:00Z. Do not run successor readiness or planning before epoch close. '
              'After close run outcome-blind read-only readiness; only if ready write the feature-only '
              'no-clobber plan, then stop before model fitting or final-holdout access.'
          )
          v3['successor_gate_b'] = {
              'research_plan_version': PLAN_V2,
              'epoch_start': V2_START,
              'epoch_end': V2_END,
              'eligibility': 'market_start_at >= epoch_start AND market_start_at < epoch_end',
              'runtime_implementation_checkpoint': RUNTIME_HEAD,
              'runtime_ci_run_id': RUNTIME_CI,
              'runtime_ci_passed': True,
              'historical_manifests_runtime_required': False,
              'retired_v1_policy_selection_executable': False,
              'retired_v1_epoch_data_policy': 'engineering_coverage_only',
              'posthoc_diagnosis_reconstruction_allowed': False,
              'consumed_v2_historical_exclusion_count': 48,
              'readiness_performed': False,
              'plan_performed': False,
              'training_performed': False,
              'final_holdout_access_performed': False,
          }
          completed = state['completed']
          completion = (
              'Phase 14 V3 Gate B successor v2 repository runtime implemented at '
              f'{RUNTIME_HEAD} with CI {RUNTIME_CI}; historical manifests are evidence-only, '
              'pre-epoch markets are structurally ineligible, and no readiness, planning, training, '
              'or final-holdout access was performed'
          )
          if completion not in completed:
              completed.append(completion)
          state['not_completed'] = [
              'V3 Gate B successor v2 outcome-blind readiness and feature-only plan after the frozen epoch closes; model fitting and final-holdout access remain separate authorization boundaries',
              'Phase 15 controlled live launch',
              'Live trading',
          ]
          state['next_actions'] = [
              f'Continue prospective core-v3-btc-native source/feature collection for {PLAN_V2} through {V2_END}; do not run successor readiness or planning before that timestamp.',
              f'After {V2_END}, run only the outcome-blind read-only successor readiness check; if and only if ready, write the fixed five-fold feature-only no-clobber plan and stop.',
              'Preserve the retired v1 epoch as engineering/source-availability/leakage/coverage evidence only. Never reconstruct the unfrozen diagnosis cohort post hoc; preserve all 48 consumed-V2 historical condition IDs as permanently non-reusable contamination evidence.',
              'No model fitting, final-holdout access/evaluation, model or paper activation, production deployment/restart/migration, live trading, automatic promotion, geographic bypass, or money-limit change is authorized.',
          ]
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          # BUILD-ORDER.md: preserve history; replace only the final current action.
          build_path = ROOT / 'docs/BUILD-ORDER.md'
          build = build_path.read_text(encoding='utf-8')
          marker = '## Immediate next action\n'
          assert build.count(marker) == 1
          prefix = build.split(marker, 1)[0]
          build_tail = f'''## Immediate next action

Gate A production coverage for `core-v3-btc-native` remains accepted PASS under coverage input SHA-256 `{COVERAGE_SHA}`. The historical Gate B v1 design remains frozen at `{PREREG_COMMIT}`, but `{PLAN_V1}` is retired and non-executable for model/policy selection because the exact diagnosis cohort identities were not durably frozen before its `{V1_START}` to `{V1_END}` epoch. That epoch is retained only as immutable engineering, source-availability, leakage, and coverage evidence; never reconstruct the diagnosis cohort post hoc. The 48 recovered consumed-V2 final-holdout condition IDs remain permanently non-reusable historical contamination evidence.

The active successor is `{PLAN_V2}` with epoch `[{V2_START}, {V2_END})`. Eligibility is structural: `market_start_at >= epoch_start AND market_start_at < epoch_end`; every pre-epoch market is ineligible. Historical diagnosis and consumed-V2 identities remain evidence but are not successor runtime inputs. Repository runtime checkpoint `{RUNTIME_HEAD}` passed exact-head CI `{RUNTIME_CI}` with outcome-blind readiness, feature-only planning, PostgreSQL read-only transactions, no-clobber plan output, and the frozen search/economic contract preserved.

Continue prospective `core-v3-btc-native` collection through `{V2_END}`. Do not run successor readiness or planning before that time. After epoch close, run only the read-only **outcome-blind readiness** command; if and only if it is ready, write the fixed five-fold **feature-only plan**, then stop. No model fitting, no final-holdout access or evaluation, no model/paper activation, no production mutation, no live trading, no automatic promotion, and no money-limit change is part of this next action.

Preserve the paused V2 adaptive path and all V1/V2 evidence unchanged.
'''
          build_path.write_text(prefix + build_tail, encoding='utf-8')

          # DECISION-LOG.md: append D-048; earlier decisions stay immutable.
          decision_path = ROOT / 'docs/DECISION-LOG.md'
          decisions = decision_path.read_text(encoding='utf-8')
          assert '## D-048 —' not in decisions
          d48 = f'''

## D-048 — Retire Gate B v1 and execute successor v2 with structural prospective contamination boundary

**Date:** 14 Sep 2026  
**Status:** Active

`{PLAN_V1}` remains immutable historical preregistration evidence but is retired and non-executable for model/policy selection because the exact 84-trade diagnosis identities were not durably frozen before its `{V1_START}` to `{V1_END}` prospective epoch. No post-hoc diagnosis reconstruction is allowed. Data from that epoch may be retained only as engineering, source-availability, leakage, and coverage evidence. The complete 48-condition consumed-V2 final-holdout contamination boundary remains permanently non-reusable historical evidence. Gate A coverage remains accepted under `{COVERAGE_SHA}` and the historical preregistration design commit remains `{PREREG_COMMIT}`.

The approved clean successor is `{PLAN_V2}` for `core-v3-btc-native`, with epoch `[{V2_START}, {V2_END})`. Contamination control is structural: only `market_start_at >= epoch_start AND market_start_at < epoch_end` may enter train/validation/test/final-holdout membership, so every pre-epoch market is ineligible. Historical diagnosis and consumed-V2 manifests are evidence only and are not successor runtime selection inputs. The v1 predictor/model/calibration/economic search contract is otherwise unchanged.

Repository runtime checkpoint `{RUNTIME_HEAD}` passed CI `{RUNTIME_CI}`. The implementation preserves outcome-blind readiness, feature-only planning, PostgreSQL read-only transactions, and no-clobber plan output. No successor readiness or plan has been run yet. No model fitting, final-holdout access/evaluation, activation, production mutation, live trading, automatic promotion, geographic bypass, or money-limit change is authorized by this decision.
'''
          decision_path.write_text(decisions.rstrip() + d48 + '\n', encoding='utf-8')

          # CHANGELOG.md: prepend the new source-of-truth release entry.
          changelog_path = ROOT / 'docs/CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          assert changelog.startswith('# Changelog\n')
          assert '## 0.14.139 — 14 September 2026' not in changelog
          marker_138 = '## 0.14.138 — 13 September 2026'
          assert marker_138 in changelog
          entry = f'''## 0.14.139 — 14 September 2026

- Retired historical `{PLAN_V1}` for model/policy selection because the exact diagnosis cohort identities were not durably frozen before its `{V1_START}` to `{V1_END}` epoch. That interval is engineering/source-availability/leakage/coverage evidence only; post-hoc diagnosis reconstruction is forbidden. The 48 consumed-V2 historical final-holdout condition IDs remain permanently non-reusable evidence.
- Froze the clean successor `{PLAN_V2}` for `core-v3-btc-native` on `[{V2_START}, {V2_END})` with structural eligibility `market_start_at >= epoch_start AND market_start_at < epoch_end`. Historical exclusion manifests are no longer successor runtime inputs; the existing predictor/model/calibration/economic search contract is unchanged. Gate A coverage remains bound to `{COVERAGE_SHA}` and historical preregistration provenance to `{PREREG_COMMIT}`.
- Implemented the successor repository runtime through checkpoint `{RUNTIME_HEAD}`; exact-head CI `{RUNTIME_CI}` passed. Readiness remains outcome-blind, planning remains feature-only/read-only, and plan output remains no-clobber. No readiness/plan execution, model fitting, final-holdout access/evaluation, activation, production mutation, live trading, automatic promotion, or money-limit change occurred.
- Current action is prospective collection only through `{V2_END}`; after close, run read-only outcome-blind readiness and, only if ready, write the feature-only plan and stop.

'''
          changelog_path.write_text(changelog.replace(marker_138, entry + marker_138, 1), encoding='utf-8')

          # MASTER source: append a current-order section that explicitly supersedes v1 execution wording.
          master_path = ROOT / 'docs/MASTER-SOURCE-OF-TRUTH.md'
          master = master_path.read_text(encoding='utf-8')
          heading = '## Phase 14 BTC-first V3 Gate B successor runtime implementation — 14 September 2026'
          assert heading not in master
          master_section = f'''

{heading}

This section supersedes the **execution order** in the 13 September V3 Gate B v1 preregistration section while preserving that historical record unchanged. Gate A coverage for `core-v3-btc-native` remains accepted PASS under SHA-256 `{COVERAGE_SHA}`, and the historical preregistration design remains `{PREREG_COMMIT}`.

Historical `{PLAN_V1}` is retired and non-executable for model/policy selection. Its prospective epoch was `{V1_START}` through `{V1_END}`. The exact 84-trade diagnosis identities were not durably frozen before that epoch began, so they must never be reconstructed from current database state, later settlements/outcomes, inferred timestamps, approximate windows, or synthetic/empty manifests. The Sep13–16 epoch is engineering, source-availability, leakage, and coverage evidence only. The complete 48 unique consumed-V2 final-holdout condition IDs remain permanently non-reusable historical contamination evidence.

The active successor is `{PLAN_V2}` with dataset `supervised-core-v3-btc-native-v1`, feature version `core-v3-btc-native`, label version `official-outcome-v1`, and frozen epoch `[{V2_START}, {V2_END})`. Eligibility is exactly `market_start_at >= epoch_start AND market_start_at < epoch_end`; every pre-epoch market is structurally ineligible for train, validation, test, or final-holdout membership. Historical diagnosis and consumed-V2 identities remain evidence and are not runtime selection inputs. The successor otherwise preserves the v1 predictor set, five candidates, calibration rules, fee/slippage and edge grid, selected-book freshness limit, validation-economics gates, 24h/6h/6h/6h geometry, five ordinary folds, one-market embargo, and 12-hour final reserve.

The repository runtime implementation checkpoint is `{RUNTIME_HEAD}` and exact-head CI `{RUNTIME_CI}` passed. The runtime exposes outcome-blind readiness and feature-only planning without historical manifest arguments, keeps PostgreSQL transactions read-only, and preserves exclusive/no-clobber plan output. This is repository engineering only: successor readiness has not been run, the feature-only plan has not been written against the prospective epoch, and no outcome/label inspection, model fitting, final-holdout access/evaluation, model/paper activation, production deployment/restart/migration, live trading, automatic promotion, geographic bypass, or money-limit change occurred.

**Current order:** continue prospective `core-v3-btc-native` source/feature collection through `{V2_END}`. Do not run successor readiness or planning before epoch close. After close, run only the read-only outcome-blind readiness check; if and only if ready, write the fixed five-fold feature-only no-clobber plan, then stop for a separate review/authorization boundary. No model fitting and no final-holdout access are authorized.
'''
          master_path.write_text(master.rstrip() + master_section + '\n', encoding='utf-8')

          # Advance the legacy source-truth test from "runtime pending" to the implemented handoff.
          test_path = ROOT / 'tests/improvement/test_v3_gate_a_source_truth.py'
          test_text = test_path.read_text(encoding='utf-8')
          old_marker = 'def test_successor_design_handoff_is_pending_runtime_source_truth_update() -> None:\n'
          assert old_marker in test_text
          prefix = test_text.split(old_marker, 1)[0]
          replacement = '''def test_successor_runtime_handoff_points_to_prospective_collection() -> None:
    start = _text("START-HERE.md")
    build = _text("docs/BUILD-ORDER.md")

    start_next = start.split("## Immediate next task", 1)[1]
    lowered_start = start_next.lower()
    assert "core-v3-btc-native" in start_next
    assert SUCCESSOR_PLAN_VERSION in start_next
    assert SUCCESSOR_EPOCH_START in start_next
    assert SUCCESSOR_EPOCH_END in start_next
    assert "continue prospective" in lowered_start
    assert "outcome-blind" in lowered_start
    assert "readiness" in lowered_start
    assert "feature-only" in lowered_start
    assert "no model fitting" in lowered_start
    assert "no final-holdout access" in lowered_start
    assert "implement `v3-gate-b-preregister-v2`" not in lowered_start

    build_next = build.split("## Immediate next action", 1)[1]
    lowered_build = build_next.lower()
    assert "core-v3-btc-native" in build_next
    assert SUCCESSOR_PLAN_VERSION in build_next
    assert SUCCESSOR_EPOCH_START in build_next
    assert SUCCESSOR_EPOCH_END in build_next
    assert "outcome-blind" in lowered_build
    assert "readiness" in lowered_build
    assert "feature-only" in lowered_build
    assert "plan" in lowered_build
    assert "no model fitting" in lowered_build
    assert "adaptive-train" not in lowered_build
'''
          test_path.write_text(prefix + replacement, encoding='utf-8')
          PY

          rm -f .github/workflows/source-truth-snapshot.yml
          rm -f .github/workflows/source-truth-update.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_STATE.json docs/BUILD-ORDER.md docs/DECISION-LOG.md docs/CHANGELOG.md docs/MASTER-SOURCE-OF-TRUTH.md tests/improvement/test_v3_gate_a_source_truth.py .github/workflows/source-truth-snapshot.yml .github/workflows/source-truth-update.yml
          git diff --cached --check
          git commit -m "Advance V3 successor runtime source truth"
          git push origin HEAD:research/v3-gate-b-successor-runtime
