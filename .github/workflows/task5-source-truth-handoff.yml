name: Task 5 source-of-truth handoff

on:
  push:
    branches:
      - feature/btc-first-v3-gate-a
    paths:
      - .github/workflows/task5-source-truth-handoff.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/btc-first-v3-gate-a
          fetch-depth: 0

      - name: Patch canonical handoff state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path('.')
          VERSION = '0.14.136'
          IMPLEMENTATION_HEAD = 'e09e9834260996553fa3cff7c18bf5269e48f4f0'
          IMPLEMENTATION_CI_RUN = 34757241403

          # PROJECT_STATE.json: preserve all existing keys/history and append the V3 checkpoint.
          state_path = ROOT / 'PROJECT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['source_of_truth_version'] = VERSION
          state['updated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          state['phase_14_btc_first_v3_gate_a'] = {
              'implementation_status': 'REPOSITORY_IMPLEMENTED_AWAITING_COVERAGE_ACCEPTANCE',
              'feature_version': 'core-v3-btc-native',
              'label_version': 'official-outcome-v1',
              'horizon_seconds': 300,
              'offsets_seconds': [60, 120, 180, 240],
              'forecast_sources': ['coinbase_spot', 'bybit_spot', 'bybit_linear'],
              'btc_only_forecast_contract': True,
              'polymarket_predictor_keys_allowed': False,
              'outcome_blind_coverage_report': True,
              'future_data_perturbation_test': True,
              'pr': 192,
              'implementation_head': IMPLEMENTATION_HEAD,
              'implementation_ci_run_id': IMPLEMENTATION_CI_RUN,
              'implementation_ci_passed': True,
              'v2_adaptive_training_paused': True,
              'training_performed': False,
              'production_rollout_performed': False,
              'production_migration_performed': False,
              'model_activation_performed': False,
              'paper_activation_performed': False,
              'final_holdout_access_performed': False,
              'automatic_promotion': False,
              'live_trading_enabled': False,
              'max_trade_size_usd': 0,
              'max_daily_loss_usd': 0,
              'source_design': 'docs/superpowers/specs/2026-09-13-phase-14-btc-first-v3-challenger-design.md',
              'source_plan': 'docs/superpowers/plans/2026-09-13-phase-14-btc-first-v3-gate-a.md',
              'next_action': 'Collect outcome-blind core-v3-btc-native coverage and perform separate Gate A acceptance; no training or activation.',
          }
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          # CHANGELOG: prepend a new source-of-truth release entry without rewriting history.
          changelog_path = ROOT / 'docs/CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## 0.14.136 — 13 September 2026'
          if heading not in changelog:
              anchor = '# Changelog\n\n'
              if not changelog.startswith(anchor):
                  raise SystemExit('unexpected CHANGELOG header')
              entry = f'''{heading}\n\n- Recorded repository-only BTC-first V3 Gate A implementation for `core-v3-btc-native` on PR #192. The audited implementation checkpoint is `{IMPLEMENTATION_HEAD}` and CI run `{IMPLEMENTATION_CI_RUN}` passed before this handoff.\n- Gate A uses 5-minute horizon offsets `60, 120, 180, 240`, BTC-native Coinbase/Bybit forecast inputs only, explicit missing/stale semantics, future-data perturbation protection, and an outcome-blind coverage report with zero Polymarket predictor keys.\n- V2 adaptive training remains paused. This checkpoint performs no training, no production rollout or migration, no model/paper activation, no final-holdout access, no automatic promotion, no live trading, and no money-limit change.\n- Next action is outcome-blind V3 coverage collection followed by a separate Gate A acceptance decision.\n\n'''
              changelog = anchor + entry + changelog[len(anchor):]
              changelog_path.write_text(changelog, encoding='utf-8')

          # DECISION-LOG: append D-045; preserve every prior decision verbatim.
          decisions_path = ROOT / 'docs/DECISION-LOG.md'
          decisions = decisions_path.read_text(encoding='utf-8')
          d045 = '## D-045 — BTC-first V3 Gate A'
          if d045 not in decisions:
              addition = f'''\n\n{d045}\n**Date:** 13 Sep 2026\n**Status:** Active\n\nRepository implementation for the separately versioned `core-v3-btc-native` Gate A challenger is complete on PR #192 at audited implementation head `{IMPLEMENTATION_HEAD}`; CI run `{IMPLEMENTATION_CI_RUN}` passed before the source-of-truth handoff. The forecast contract is BTC-native only (Coinbase spot, Bybit spot, Bybit linear) at fixed 60/120/180/240-second offsets for 5-minute markets. Polymarket price/book inputs are excluded from the V3 forecast payload and remain an execution/evaluation concern. Outcome-blind coverage reporting and future-data perturbation regression coverage are part of Gate A.\n\nV2 adaptive training remains paused despite prior readiness evidence. Existing V1/V2 features, adaptive-readiness evidence, Gate B evidence, and consumed holdout history remain immutable and truthful; they are not reset or rewritten by V3. The 84-trade diagnosis cohort is not a validation/test/final-holdout set for policy selection.\n\nThis decision records repository implementation only, not Gate A acceptance or production rollout. No training, production migration, model activation, paper activation, final-holdout access, automatic promotion, Phase 15 progression, geographic bypass, live trading, or nonzero money is authorized. The next step is outcome-blind V3 coverage collection followed by a separate Gate A acceptance decision.\n'''
              decisions_path.write_text(
                  decisions.rstrip() + addition.rstrip() + '\n', encoding='utf-8'
              )

          # MASTER: append an audited V3 Gate A repository checkpoint.
          master_path = ROOT / 'docs/MASTER-SOURCE-OF-TRUTH.md'
          master = master_path.read_text(encoding='utf-8')
          master_heading = '### Phase 14 BTC-first V3 Gate A repository checkpoint — 13 September 2026'
          if master_heading not in master:
              addition = f'''\n\n{master_heading}\n\nThe separate immutable V3 feature family is `core-v3-btc-native`, with `official-outcome-v1` as the eventual supervised label, 5-minute horizon only, and fixed feature offsets 60, 120, 180, and 240 seconds after market start. Forecast predictors are BTC-native Coinbase spot, Bybit spot, and Bybit linear state only. Polymarket price/book fields are not V3 forecast predictors; they remain downstream executable benchmark/evaluation inputs. Missing or stale BTC evidence remains explicit, and future rows must not change historical features.\n\nRepository Gate A implementation is present on PR #192. The audited pre-handoff implementation checkpoint is `{IMPLEMENTATION_HEAD}` and GitHub Actions CI run `{IMPLEMENTATION_CI_RUN}` passed. Gate A includes deterministic as-of BTC state reads, BTC return/cross-venue calculators, immutable V3 feature materialization, a future-data perturbation regression, and outcome-blind coverage reporting that selects no policy and performs no training. Existing V1/V2 semantics and evidence remain immutable.\n\nThis is **repository implementation evidence, not Gate A acceptance**. No production rollout was performed, no production migration/restart occurred, no V2 or V3 training was run, no model or paper activation occurred, no final holdout was accessed, and automatic promotion remains false. The current V2 adaptive training path remains paused even though its historical readiness evidence remains valid. Phase 14 stays in RESEARCH mode with live trading disabled and both money limits at zero.\n\nThe immediate research action is to collect and inspect outcome-blind `core-v3-btc-native` coverage and then make a separate Gate A acceptance decision. Training or activation requires a later explicitly authorized plan after Gate A acceptance.\n'''
              master_path.write_text(
                  master.rstrip() + addition.rstrip() + '\n', encoding='utf-8'
              )

          # BUILD-ORDER: preserve the prior immediate-action tail as historical context,
          # then make the new immediate section unambiguously V3 coverage/Gate A only.
          build_path = ROOT / 'docs/BUILD-ORDER.md'
          build = build_path.read_text(encoding='utf-8')
          marker = '## Immediate next action'
          new_marker = '## Historical handoff context superseded on 13 September 2026'
          if '## Immediate next action\n\n**Collect outcome-blind `core-v3-btc-native` coverage' not in build:
              if marker not in build:
                  raise SystemExit('missing BUILD-ORDER immediate-action marker')
              prefix, tail = build.split(marker, 1)
              preserved = new_marker + tail
              immediate = '''\n\n## Immediate next action\n\n**Collect outcome-blind `core-v3-btc-native` coverage and perform the separate V3 Gate A acceptance review.**\n\nKeep this step feature/coverage only. Verify the fixed 60/120/180/240-second BTC-native feature contract, zero Polymarket predictor keys, explicit missing/stale behavior, and future-data safety using the repository coverage/reporting path. Do not run model training, activate a paper model, mutate production, access a final holdout, or change any live/money safety setting. Preserve all V1/V2 and adaptive-learning evidence unchanged.\n'''
              build_path.write_text(prefix + preserved.rstrip() + immediate, encoding='utf-8')

          # START-HERE was updated directly before this helper was introduced. Verify the
          # durable handoff contract rather than rewriting it again.
          start = (ROOT / 'START-HERE.md').read_text(encoding='utf-8')
          required = [
              '## Immediate next task',
              'core-v3-btc-native',
              'Gate A',
              'coverage',
              'PR #192',
              IMPLEMENTATION_HEAD,
              str(IMPLEMENTATION_CI_RUN),
          ]
          missing = [item for item in required if item not in start]
          if missing:
              raise SystemExit(f'START-HERE missing expected handoff fields: {missing}')
          PY

          python -m json.tool PROJECT_STATE.json >/dev/null
          git diff --check

      - name: Commit handoff files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.json START-HERE.md docs/CHANGELOG.md docs/BUILD-ORDER.md docs/DECISION-LOG.md docs/MASTER-SOURCE-OF-TRUTH.md
          if git diff --cached --quiet; then
            echo 'No handoff changes required.'
            exit 0
          fi
          git commit -m 'docs: record BTC-first V3 Gate A repository state'
          git push origin HEAD:feature/btc-first-v3-gate-a
