name: Phase 14 Restore Post-Sync Decision History

on:
  push:
    branches:
      - phase14-prospective-outcome-sync
    paths:
      - scripts/dev/restore_phase14_postsync_decision_history.py

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore decision history and retain D-031
        run: python scripts/dev/restore_phase14_postsync_decision_history.py

      - name: Commit restored decision history
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DECISION-LOG.md
          if git diff --cached --quiet; then
            echo "No decision history changes required"
            exit 0
          fi
          git commit -m "docs: restore decision history before D-031"
          git push origin HEAD:phase14-prospective-outcome-sync
