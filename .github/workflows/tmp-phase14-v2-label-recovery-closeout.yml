name: Temporary Phase 14 V2 label recovery closeout

on:
  push:
    branches:
      - phase14-v2-gate-b-label-recovery-merge-closeout
    paths:
      - .github/workflows/tmp-phase14-v2-label-recovery-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14-v2-gate-b-label-recovery-merge-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply and verify closeout
        run: |
          python .github/tmp_phase14_v2_label_recovery_closeout.py
          python -m json.tool PROJECT_STATE.json >/dev/null
          pytest tests/v2_research/test_gate_b_contract.py tests/deploy/test_phase14_v2_gate_b_label_recovery.py -q
          git diff --check
      - name: Commit closeout and remove temporary files
        run: |
          rm .github/tmp_phase14_v2_label_recovery_closeout.py
          rm .github/workflows/tmp-phase14-v2-label-recovery-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record Phase 14 V2 recovery merge closeout"
          git push origin HEAD:phase14-v2-gate-b-label-recovery-merge-closeout
