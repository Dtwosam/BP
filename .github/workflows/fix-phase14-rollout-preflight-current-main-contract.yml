name: Fix Phase14 rollout preflight current-main contract

on:
  push:
    branches:
      - fix/phase14-rollout-preflight-current-main-contract

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase14-rollout-preflight-current-main-contract
          fetch-depth: 0
      - name: Apply source-truth correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          historical = 'f3ef5717390d0dd8d577bdc73143baabd12ff5ce'
          candidate = '7c3af78da1922a0e5187c24b799951130cc98887'
          deployed = '71b33d3beaba4a11ef93e7c5bde1c517323f3440'
          helper = 'scripts/deploy/phase14_v2_outcome_label_coverage_rollout_preflight_cloudshell.sh'
          env_var = 'PHASE14_V2_OUTCOME_LABEL_ROLLOUT_HELPER_HEAD'

          project_path = root / 'PROJECT_STATE.json'
          project = project_path.read_text(encoding='utf-8')
          project = project.replace(
              '"source_of_truth_version": "0.14.130"',
              '"source_of_truth_version": "0.14.131"',
              1,
          )
          project = project.replace(
              '"updated_at": "2026-09-11T11:43:03Z"',
              '"updated_at": "2026-09-11T12:05:00Z"',
              1,
          )
          old_action = (
              f'Run {helper} from a clean checkout at exact merged main {historical} '
              f'to verify immutable candidate {candidate} against deployed head {deployed}. '
              'This is a read-only production preflight and does not authorize or perform the production rollout.'
          )
          new_action = (
              f'Run {helper} from a clean checkout of the then-current `main`, set {env_var} '
              f'to that exact current main SHA, and require fetched origin/main to match it. PR #182 merge {historical} '
              f'is historical provenance, not a pinned checkout target. Verify immutable candidate {candidate} '
              f'against deployed head {deployed}. This is a read-only production preflight and does not authorize '
              'or perform the production rollout.'
          )
          old_json = json.dumps(old_action)
          new_json = json.dumps(new_action)
          if old_json not in project:
              raise SystemExit('stale PROJECT_STATE next_action not found exactly once')
          project = project.replace(old_json, new_json, 1)
          json.loads(project)
          project_path.write_text(project, encoding='utf-8')

          build_path = root / 'docs/BUILD-ORDER.md'
          build = build_path.read_text(encoding='utf-8')
          old_build = (
              f'Current order: (1) run that exact merged helper as a read-only production preflight from a clean checkout at `{historical}`; '
              'it does not authorize or perform the production rollout; '
              f'(2) only after preflight PASS, cross the separate exact production-mutation authorization boundary for rollout/acceptance of candidate `{candidate}`; '
              '(3) only after accepted rollout, build a fresh statistically clean feature-only Gate B planning epoch with a new final holdout; '
              '(4) preserve RESEARCH, `LIVE_TRADING_ENABLED=false`, zero money limits, `automatic_promotion=false`, and Phase 15/live-trading blocks throughout.'
          )
          new_build = (
              f'Current order: (1) from a clean checkout of the then-current `main`, set `{env_var}` to that exact current main SHA and run '
              f'`{helper}` as the read-only production preflight; the helper itself requires fetched `origin/main` to equal that SHA. '
              f'PR #182 merge `{historical}` is historical provenance, not a pinned checkout target, and the preflight does not authorize or perform the production rollout; '
              f'(2) only after preflight PASS, cross the separate exact production-mutation authorization boundary for rollout/acceptance of candidate `{candidate}`; '
              '(3) only after accepted rollout, build a fresh statistically clean feature-only Gate B planning epoch with a new final holdout; '
              '(4) preserve RESEARCH, `LIVE_TRADING_ENABLED=false`, zero money limits, `automatic_promotion=false`, and Phase 15/live-trading blocks throughout.'
          )
          if build.count(old_build) != 1:
              raise SystemExit('stale BUILD-ORDER instruction not found exactly once')
          build_path.write_text(build.replace(old_build, new_build, 1), encoding='utf-8')

          master_path = root / 'docs/MASTER-SOURCE-OF-TRUTH.md'
          master = master_path.read_text(encoding='utf-8')
          clarification = (
              '\n\nOperator binding clarification: PR #182 merge `'
              + historical
              + '` is historical provenance only. Because the preflight helper requires its local checkout and fetched `origin/main` to equal `'
              + env_var
              + '`, operators must run it from a clean checkout of the then-current `main` and set that variable to the exact current main SHA. '
              + 'A historical helper-merge SHA must not be reused as a pinned checkout target after `main` advances; this correction changes no production state or authorization boundary.'
          )
          if clarification.strip() not in master:
              master = master.rstrip() + clarification + '\n'
          master_path.write_text(master, encoding='utf-8')

          changelog_path = root / 'docs/CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          prefix = '# Changelog\n\n'
          if not changelog.startswith(prefix):
              raise SystemExit('unexpected changelog heading')
          entry = (
              '## 0.14.131 — 11 September 2026\n\n'
              f'- Corrected the Phase 14 V2 outcome-label rollout preflight operator contract so `{env_var}` binds to the exact then-current `main` SHA and fetched `origin/main` must match it.\n'
              f'- PR #182 merge `{historical}` remains historical provenance for the helper implementation, not a pinned checkout target after `main` advances; immutable rollout candidate `{candidate}` and deployed production head `{deployed}` are unchanged.\n'
              '- The read-only production preflight remains unperformed from an authenticated production operator environment, the rollout remains undeployed, and no production mutation or authorization boundary changed.\n'
              '- RESEARCH mode, live trading disabled, zero money limits, automatic promotion false, consumed Gate B holdout non-reusable, and Phase 15 blocked remain unchanged.\n\n'
          )
          if not changelog.startswith(prefix + '## 0.14.131'):
              changelog = prefix + entry + changelog[len(prefix):]
          changelog_path.write_text(changelog, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-phase14-rollout-preflight-current-main-contract.yml
          git diff --check
          python -m json.tool PROJECT_STATE.json >/dev/null
      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.json docs/BUILD-ORDER.md docs/MASTER-SOURCE-OF-TRUTH.md docs/CHANGELOG.md .github/workflows/fix-phase14-rollout-preflight-current-main-contract.yml
          git diff --cached --check
          git commit -m 'Fix rollout preflight current-main operator binding'
          git push origin HEAD:fix/phase14-rollout-preflight-current-main-contract
