name: Apply Recorder Runtime Transport Fix

on:
  push:
    branches:
      - build/phase-2-recorder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recorder branch
        uses: actions/checkout@v4
        with:
          ref: build/phase-2-recorder

      - name: Apply verified runtime fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int | None = None) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              updated = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(updated)

          replace(
              "src/bp_engine/config.py",
              'database_url: str = "postgresql://bp:bp_dev_only@localhost:5432/bp"',
              'database_url: str = "postgresql+psycopg://bp:bp_dev_only@localhost:5432/bp"',
          )
          replace(
              "src/bp_engine/config.py",
              "    recorder_require_ntp_sync: bool = True\n",
              "    recorder_require_ntp_sync: bool = True\n"
              "    recorder_ws_max_message_bytes: int = 8 * 1024 * 1024\n",
          )
          replace(
              ".env.example",
              "DATABASE_URL=postgresql://bp:bp_dev_only@localhost:5432/bp",
              "DATABASE_URL=postgresql+psycopg://bp:bp_dev_only@localhost:5432/bp",
          )
          env = Path(".env.example")
          env_text = env.read_text()
          if "RECORDER_WS_MAX_MESSAGE_BYTES=" not in env_text:
              env.write_text(
                  env_text.replace(
                      "RECORDER_REQUIRE_NTP_SYNC=true\n",
                      "RECORDER_REQUIRE_NTP_SYNC=true\nRECORDER_WS_MAX_MESSAGE_BYTES=8388608\n",
                  )
              )
          replace(
              ".github/workflows/recorder-short-soak.yml",
              "DATABASE_URL: postgresql://bp:bp_ci_only@localhost:5432/bp",
              "DATABASE_URL: postgresql+psycopg://bp:bp_ci_only@localhost:5432/bp",
          )
          replace(
              "src/bp_engine/recorder/service.py",
              "from datetime import UTC, datetime\nfrom typing import Protocol",
              "from datetime import UTC, datetime\nfrom functools import partial\nfrom typing import Protocol",
          )
          replace(
              "src/bp_engine/recorder/service.py",
              "    engine = create_engine(settings.database_url)\n    metadata.create_all(engine)\n",
              "    engine = create_engine(settings.database_url)\n"
              "    websocket_connect = partial(\n"
              "        connect, max_size=settings.recorder_ws_max_message_bytes\n"
              "    )\n"
              "    metadata.create_all(engine)\n",
          )
          service = Path("src/bp_engine/recorder/service.py")
          service.write_text(service.read_text().replace("connector=connect,", "connector=websocket_connect,"))

          replace(
              "scripts/recorder_smoke.py",
              "from datetime import UTC, datetime\nfrom pathlib import Path",
              "from datetime import UTC, datetime\nfrom functools import partial\nfrom pathlib import Path",
          )
          replace(
              "scripts/recorder_smoke.py",
              "from bp_engine.collectors.websocket_runner import WebSocketCollectorRunner\n",
              "from bp_engine.collectors.websocket_runner import WebSocketCollectorRunner\n"
              "from bp_engine.config import Settings\n",
          )
          replace(
              "scripts/recorder_smoke.py",
              "    incidents: list[object] = []\n",
              "    incidents: list[object] = []\n"
              "    settings = Settings(_env_file=None)\n"
              "    websocket_connect = partial(\n"
              "        connect, max_size=settings.recorder_ws_max_message_bytes\n"
              "    )\n",
          )
          smoke = Path("scripts/recorder_smoke.py")
          smoke.write_text(smoke.read_text().replace("connector=connect,", "connector=websocket_connect,"))

          replace(
              "tests/test_config.py",
              "    assert settings.polymarket_refresh_interval_seconds > 0\n"
              "    assert settings.live_trading_enabled is False\n",
              "    assert settings.polymarket_refresh_interval_seconds > 0\n"
              "    assert settings.recorder_ws_max_message_bytes == 8 * 1024 * 1024\n"
              "    assert settings.database_url.startswith(\"postgresql+psycopg://\")\n"
              "    assert settings.live_trading_enabled is False\n",
          )

          Path(".github/workflows/runtime-transport-fix.yml").unlink()
          PY

      - name: Commit patched recorder runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .env.example \
            .github/workflows/recorder-short-soak.yml \
            src/bp_engine/config.py \
            src/bp_engine/recorder/service.py \
            scripts/recorder_smoke.py \
            tests/test_config.py
          git add -u -- .github/workflows/runtime-transport-fix.yml
          git commit -m "fix: harden recorder transport and postgres driver"
          git push origin HEAD:build/phase-2-recorder
