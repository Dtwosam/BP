name: Live Gamma Smoke

on:
  push:
    branches:
      - build/phase-1-market-discovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gamma-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Query live Polymarket Gamma markets
        run: python scripts/gamma_smoke.py

      - name: Upload captured Gamma responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-smoke-capture
          path: gamma-smoke-capture.json
          if-no-files-found: ignore

      - name: Persist successful live capture
        if: success()
        run: |
          mkdir -p tests/fixtures/polymarket/live
          cp gamma-smoke-capture.json tests/fixtures/polymarket/live/gamma-smoke-capture.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/fixtures/polymarket/live/gamma-smoke-capture.json
          if git diff --cached --quiet; then
            echo "Live Gamma capture unchanged."
          else
            git commit -m "test: capture live Gamma market fixtures [skip ci]"
            git push origin HEAD:build/phase-1-market-discovery
          fi
